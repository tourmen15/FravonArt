<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System Animation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">
        <h2>Solar System</h2>
        <p>Time remaining: <span id="timer">30</span>s</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        
        // Camera: Field of View, Aspect Ratio, Near clip, Far clip
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 120, 200); // Positioned up and back to look down at the system
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        // Ambient light for general visibility
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        // Point light representing the Sun's light
        const pointLight = new THREE.PointLight(0xFFFFFF, 1.5, 300);
        scene.add(pointLight);

        // --- 3. OBJECT CREATION FUNCTIONS ---
        
        // Helper to create planets
        const planets = [];
        function createPlanet(size, color, orbitRadius, speed) {
            // Mesh
            const geometry = new THREE.SphereGeometry(size, 32, 32);
            const material = new THREE.MeshLambertMaterial({ color: color });
            const planet = new THREE.Mesh(geometry, material);
            
            // Orbit Object (parent container to manage rotation easier)
            const orbitContainer = new THREE.Object3D();
            orbitContainer.add(planet);
            scene.add(orbitContainer);
            
            planet.position.x = orbitRadius; // Offset from center

            // Draw Orbit Path (the line)
            const pathGeo = new THREE.RingGeometry(orbitRadius - 0.2, orbitRadius + 0.2, 64);
            const pathMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.1 });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = Math.PI / 2;
            scene.add(path);

            return { mesh: planet, container: orbitContainer, speed: speed, distance: orbitRadius };
        }

        // --- 4. BUILD THE SYSTEM ---

        // The Sun (BasicMaterial so it glows without needing light)
        const sunGeo = new THREE.SphereGeometry(10, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFCC00 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sun);

        // Add Planets (Size, Color, Distance, Speed)
        // Note: Scales are artistic, not realistic, for visibility.
        const planetData = [
            { name: "Mercury", size: 2, color: 0xaaaaaa, dist: 20, speed: 0.04 },
            { name: "Venus", size: 3, color: 0xffcc00, dist: 30, speed: 0.025 },
            { name: "Earth", size: 3.2, color: 0x2233ff, dist: 45, speed: 0.02 },
            { name: "Mars", size: 2.5, color: 0xff2222, dist: 60, speed: 0.016 },
            { name: "Jupiter", size: 8, color: 0xddaa88, dist: 85, speed: 0.008 },
            { name: "Saturn", size: 7, color: 0xddccaa, dist: 115, speed: 0.006 },
            { name: "Uranus", size: 5, color: 0x55aaff, dist: 145, speed: 0.004 },
            { name: "Neptune", size: 4.8, color: 0x3344cc, dist: 170, speed: 0.003 }
        ];

        planetData.forEach(data => {
            const p = createPlanet(data.size, data.color, data.dist, data.speed);
            planets.push(p);
            
            // Special Case: Add Ring for Saturn
            if (data.name === "Saturn") {
                const ringGeo = new THREE.RingGeometry(9, 14, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xaa9988, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                p.mesh.add(ring); // Add ring as a child of the planet
            }
        });

        // Simple Starfield Background
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1000;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i++) {
            starPos[i] = (Math.random() - 0.5) * 600;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.5});
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- 5. ANIMATION LOOP ---
        
        let startTime = Date.now();
        const duration = 30000; // 30 seconds in milliseconds
        let animationId;

        function animate() {
            // Check time
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, Math.ceil((duration - elapsed) / 1000));
            
            document.getElementById('timer').innerText = remaining;

            if (elapsed > duration) {
                cancelAnimationFrame(animationId);
                document.getElementById('info').innerHTML = "<h2>Solar System</h2><p>Animation Finished.</p>";
                return;
            }

            animationId = requestAnimationFrame(animate);

            // Rotate planets around the sun
            planets.forEach(obj => {
                // Rotate the invisible container to move the planet in orbit
                obj.container.rotation.y += obj.speed;
                
                // Rotate the planet on its own axis
                obj.mesh.rotation.y += 0.02;
            });
            
            // Rotate Sun
            sun.rotation.y += 0.004;

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();

    </script>
</body>
</html>

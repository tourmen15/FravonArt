<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Toy to Supercar Transformation</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* We fix the canvas resolution to 1920x1080, 
           but use CSS to ensure it fits on smaller screens 
           while maintaining aspect ratio.
        */
        canvas {
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.2);
            max-width: 100%;
            max-height: 100vh;
            aspect-ratio: 16/9;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="stage" width="1920" height="1080"></canvas>
    
    <div id="ui-layer">
        <h1>Project: TRANSFORMATION</h1>
        <p>Status: <span id="status-text">Toy Mode</span></p>
    </div>

    <script>
        // --- CONFIGURATION ---
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');

        // Animation State
        let frame = 0;
        let morphFactor = 0; // 0 = Toy, 1 = Supercar
        let direction = 1;   // 1 = Transforming up, -1 = Reverting
        let isPaused = false;
        
        // Scenery scrolling speed
        let roadOffset = 0;
        
        // --- HELPER FUNCTIONS ---

        // Linear Interpolation: Finds the number between 'start' and 'end' based on 't' (0 to 1)
        function lerp(start, end, t) {
            return start * (1 - t) + end * t;
        }

        // Ease in-out function for smoother animation
        function easeInOutQuad(t) {
            return t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        }

        // --- DRAWING FUNCTIONS ---

        function drawBackground(t) {
            // Sky Gradient change
            const r1 = lerp(135, 10, t); // Light blue to Dark Night
            const g1 = lerp(206, 10, t);
            const b1 = lerp(235, 30, t);
            
            // Draw Sky
            let grad = ctx.createLinearGradient(0, 0, 0, 600);
            grad.addColorStop(0, `rgb(${r1}, ${g1}, ${b1})`);
            grad.addColorStop(1, `rgb(${r1*0.5}, ${g1*0.5}, ${b1*0.5})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1920, 600);

            // Draw Sun / Moon
            const sunY = lerp(100, 800, t); // Sun sets
            const moonY = lerp(-200, 100, t); // Moon rises
            
            // Sun
            ctx.beginPath();
            ctx.arc(1700, sunY, 60, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700';
            ctx.fill();

            // Moon
            ctx.beginPath();
            ctx.arc(1700, moonY, 50, 0, Math.PI * 2);
            ctx.fillStyle = '#FFF';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#FFF';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawRoad(speedMultiplier) {
            // Ground
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 600, 1920, 480);

            // Horizon Line
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 595, 1920, 5);

            // Moving Road Lines
            ctx.fillStyle = '#FFF';
            let speed = 20 * speedMultiplier; 
            roadOffset = (roadOffset - speed) % 200;

            // Perspective road effect
            ctx.save();
            ctx.beginPath();
            // Clip to road area
            ctx.rect(0, 600, 1920, 480);
            ctx.clip();

            for(let i = -200; i < 2200; i += 200) {
                let x = i + roadOffset;
                // Skew logic for speed lines
                ctx.fillRect(x, 800, 100, 20);
            }
            ctx.restore();
        }

        function drawCar(t) {
            const centerX = 960;
            const centerY = 750;

            // --- INTERPOLATION VALUES (The Morph) ---
            
            // Dimensions
            const width = lerp(400, 700, t);       // Toy is short, Supercar is long
            const height = lerp(250, 140, t);      // Toy is tall, Supercar is low
            const roofCurve = lerp(0, 80, t);      // Toy is boxy, Supercar is curvy
            const wheelSize = lerp(60, 85, t);     // Wheel radius
            const wheelSpacing = lerp(220, 450, t);// Wheelbase
            const groundClearance = lerp(50, 30, t);

            // Color Transition
            const toyColor = 'rgb(220, 50, 50)'; // Flat Red
            // For supercar, we construct a gradient later, but base color is darker red
            
            const startX = centerX - (width / 2);
            const startY = centerY - groundClearance;

            ctx.save();

            // 1. THE BODY SHAPE
            ctx.beginPath();
            
            // Rear Bumper
            ctx.moveTo(startX, startY); 
            ctx.lineTo(startX, startY - height * 0.4); 
            
            // Roof / Cabin
            // Interpolating control points for Bezier curve
            const c1x = startX + width * 0.2;
            const c1y = startY - height * (lerp(1.2, 0.8, t)); // Roof height
            const c2x = startX + width * 0.8;
            const c2y = startY - height * (lerp(1.2, 0.9, t));

            // Top line (Windshield to Rear window)
            ctx.bezierCurveTo(c1x, c1y, c2x, c2y, startX + width, startY - height * 0.3);

            // Front Bumper
            ctx.lineTo(startX + width, startY);
            
            // Bottom (Wheel arches handled simply here)
            ctx.lineTo(startX, startY);
            
            ctx.closePath();

            // FILL STYLING
            if (t < 0.5) {
                // Toy Look: Plastic
                ctx.fillStyle = toyColor;
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.fill();
                
                // Toy Wind-up Key
                if(t < 0.2) {
                    ctx.fillStyle = 'silver';
                    ctx.fillRect(startX - 20, startY - height * 0.5, 20, 60);
                    ctx.beginPath();
                    ctx.arc(startX - 20, startY - height * 0.5, 30, 0, Math.PI*2);
                    ctx.stroke();
                }

            } else {
                // Supercar Look: Metallic Gradient
                let grad = ctx.createLinearGradient(startX, startY - height, startX, startY);
                grad.addColorStop(0, '#800000'); // Dark Red
                grad.addColorStop(0.5, '#ff0000'); // Bright Red
                grad.addColorStop(1, '#400000'); // Dark Bottom
                
                ctx.fillStyle = grad;
                
                // Glow effect
                ctx.shadowBlur = 20 * t;
                ctx.shadowColor = 'red';
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }

            // 2. THE WHEELS
            // Rear Wheel
            drawWheel(centerX - wheelSpacing/2, startY, wheelSize, t);
            // Front Wheel
            drawWheel(centerX + wheelSpacing/2, startY, wheelSize, t);

            // 3. SCI-FI TRANSFORMATION GRID (Visual Flair)
            if (t > 0.1 && t < 0.9) {
                ctx.strokeStyle = `rgba(0, 255, 255, ${Math.sin(frame * 0.1)})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY - 50, width/1.5, 0, Math.PI*2);
                ctx.stroke();
                
                // Scanlines
                ctx.fillStyle = `rgba(0, 255, 255, 0.1)`;
                ctx.fillRect(startX, startY - height, width, height);
            }

            ctx.restore();
        }

        function drawWheel(x, y, r, t) {
            ctx.save();
            ctx.translate(x, y);
            // Rotation based on speed
            const rotationSpeed = lerp(0.1, 0.5, t);
            ctx.rotate(frame * rotationSpeed);

            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            
            if (t < 0.5) {
                // Toy Wheel: Black rubber, small white center
                ctx.fillStyle = '#111';
                ctx.fill();
                ctx.fillStyle = '#EEE';
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Supercar Wheel: Low profile, alloy rims
                ctx.fillStyle = '#000';
                ctx.fill(); // Tire
                
                // Rim (Neon color)
                ctx.strokeStyle = '#0ff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
                ctx.stroke();
                
                // Spokes
                ctx.beginPath();
                ctx.moveTo(-r*0.7, 0); ctx.lineTo(r*0.7, 0);
                ctx.moveTo(0, -r*0.7); ctx.lineTo(0, r*0.7);
                ctx.stroke();
            }
            ctx.restore();
        }

        // --- MAIN LOOP ---

        function animate() {
            // Clear Canvas
            ctx.clearRect(0, 0, 1920, 1080);

            // Calculate Morph State
            // We oscillate morphFactor between 0 and 1 using a Sine wave logic for smooth looping
            // Or we can use a directed counter. Let's use a directed counter with pauses.
            
            if(!isPaused) {
                morphFactor += 0.005 * direction;
                
                // Pause at Toy State
                if (morphFactor <= 0) {
                    morphFactor = 0;
                    direction = 1;
                    statusText.innerText = "Mode: TOY CAR";
                    statusText.style.color = "white";
                    // Pause for a moment
                    isPaused = true;
                    setTimeout(() => { isPaused = false; }, 2000);
                }
                
                // Pause at Supercar State
                if (morphFactor >= 1) {
                    morphFactor = 1;
                    direction = -1;
                    statusText.innerText = "Mode: SUPERCAR";
                    statusText.style.color = "cyan";
                    isPaused = true;
                    setTimeout(() => { isPaused = false; }, 2000);
                }
            }

            if (morphFactor > 0 && morphFactor < 1) {
                statusText.innerText = "SYSTEM: TRANSFORMING...";
                statusText.style.color = "orange";
            }

            // Apply Easing for visuals
            const easedT = easeInOutQuad(morphFactor);

            // Draw layers
            drawBackground(easedT);
            drawRoad(lerp(1, 3, easedT)); // Speed increases as it transforms
            drawCar(easedT);

            // Update Frame
            frame++;
            requestAnimationFrame(animate);
        }

        // Start
        animate();

    </script>
</body>
</html>

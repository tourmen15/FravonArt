<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Salah Quiz #4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark-green: #013220;
            --bg-gradient-start: #024b30;
            --bg-gradient-end: #002215;
            --gold: #FFD700;
            --soft-gold: #f5e6a8;
            --light-cream: #F5F5DC;
            --glow-color: rgba(255, 215, 0, 0.7);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        #container {
            width: 100%;
            height: 100%;
            max-width: 420px; /* Common mobile width */
            max-height: 840px; /* For desktop viewing */
            aspect-ratio: 9 / 16;
            position: relative;
            background: linear-gradient(160deg, var(--bg-gradient-start), var(--bg-gradient-end));
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border-radius: 20px;
        }

        #background-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--light-cream);
            text-align: center;
            z-index: 2;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transform: scale(1.05);
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        }

        .screen.visible {
            opacity: 1;
            transform: scale(1);
        }

        #intro-screen h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            color: var(--gold);
            text-shadow: 0 0 15px var(--glow-color);
            margin: 0;
        }
        
        #intro-screen h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            color: var(--soft-gold);
            letter-spacing: 2px;
            font-weight: 400;
        }

        #quiz-screen {
            justify-content: flex-start;
            padding-top: 15%;
        }
        
        .quiz-content {
            width: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .quiz-content.visible {
            opacity: 1;
        }

        #question-text {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light-cream);
        }

        #options-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--soft-gold);
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .option.correct {
            animation: correct-glow 1.5s ease-in-out forwards;
        }
        
        @keyframes correct-glow {
            0% {
                background: rgba(255, 255, 255, 0.1);
                box-shadow: none;
            }
            50% {
                background: rgba(144, 238, 144, 0.8);
                color: var(--bg-dark-green);
                box-shadow: 0 0 20px 5px rgba(144, 238, 144, 0.7);
                border-color: lightgreen;
            }
            100% {
                 background: rgba(144, 238, 144, 0.8);
                color: var(--bg-dark-green);
                box-shadow: 0 0 20px 5px rgba(144, 238, 144, 0.7);
                border-color: lightgreen;
            }
        }
        
        /* Entrance animations for options */
        .option.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--gold);
            color: var(--bg-dark-green);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: var(--soft-gold);
            transform: translateY(-2px);
        }
        
        button:disabled {
            background-color: #888;
            cursor: not-allowed;
            transform: none;
        }
        
        #status {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            z-index: 11;
            font-size: 1rem;
            text-shadow: 1px 1px 3px black;
        }

    </style>
</head>
<body>
    <div id="container">
        <canvas id="background-canvas"></canvas>

        <div id="intro-screen" class="screen">
            <h2>Bismillah</h2>
            <h1>Salah Quiz</h1>
            <h2>#4</h2>
        </div>

        <div id="quiz-screen" class="screen">
            <div id="quiz-content" class="quiz-content">
                <div id="question-text"></div>
                <div id="options-container">
                    <div class="option" id="option-0"></div>
                    <div class="option" id="option-1"></div>
                    <div class="option" id="option-2"></div>
                    <div class="option" id="option-3"></div>
                </div>
            </div>
        </div>
        
        <div id="outro-screen" class="screen">
            <h1>JazakAllah Khair</h1>
            <h2>Quiz Complete</h2>
        </div>
        
        <div id="status"></div>
    </div>
    
    <div id="controls">
        <button id="start-btn">Start Animation</button>
        <button id="download-btn">Download Video</button>
    </div>

    <!-- Tone.js for sound synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <!-- CCapture.js for video recording -->
    <script src="https://unpkg.com/ccapture.js@1.1.0/build/CCapture.all.min.js"></script>

    <script>
        const quizData = [
            {
                question: "According to Hadith, what happens to a person’s sins between one Salah and the next?",
                options: ["They remain until Friday", "They are forgiven if major sins are avoided", "They double in reward", "They are recorded but not forgiven"],
                answer: 1
            },
            {
                question: "What did the Prophet ﷺ compare the five daily prayers to in terms of cleansing sins?",
                options: ["Bathing in a river five times a day", "Washing hands before eating", "Fasting for five days", "Drinking Zamzam water daily"],
                answer: 0
            },
            {
                question: "Which prayer, according to Hadith, protects a person from Hellfire?",
                options: ["Maghrib", "Isha", "Fajr and Asr", "Dhuhr and Isha"],
                answer: 2
            },
            {
                question: "What reward did the Prophet ﷺ promise for praying 12 Sunnah Rak‘ahs daily?",
                options: ["Forgiveness of all sins", "A house built in Paradise", "Shade on the Day of Judgment", "Protection from the grave"],
                answer: 1
            },
            {
                question: "According to Hadith, what special reward is for the one who walks to the Masjid for every Salah?",
                options: ["Each step erases a sin and raises a rank", "Each step is counted as a good deed only", "Angels surround him on the way", "He gets double reward only for Jumu‘ah"],
                answer: 0
            }
        ];

        // --- DOM Elements ---
        const startBtn = document.getElementById('start-btn');
        const downloadBtn = document.getElementById('download-btn');
        const statusEl = document.getElementById('status');
        
        const introScreen = document.getElementById('intro-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const outroScreen = document.getElementById('outro-screen');
        const quizContent = document.getElementById('quiz-content');

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const optionElements = [
            document.getElementById('option-0'),
            document.getElementById('option-1'),
            document.getElementById('option-2'),
            document.getElementById('option-3')
        ];
        
        let isAnimating = false;
        let capturer = null;

        // --- Audio Engine ---
        let synth, musicLoop, chime;
        
        async function setupAudio() {
            await Tone.start();
            // Intro Chime
            chime = new Tone.Synth({
                oscillator: { type: 'sine' },
                envelope: { attack: 0.01, decay: 1, sustain: 0.1, release: 1 }
            }).toDestination();

            // Background Oud-like music
            synth = new Tone.PluckSynth({
                attackNoise: 0.5,
                dampening: 4000,
                resonance: 0.8
            }).toDestination();
            synth.volume.value = -18;
            
            const notes = ["G3", "A3", "C4", "D4", "G4", "C4", "A3"];
            let noteIndex = 0;
            musicLoop = new Tone.Loop(time => {
                synth.triggerAttack(notes[noteIndex % notes.length], time);
                noteIndex++;
            }, "2n").start(0);
            
            Tone.Transport.bpm.value = 70;
        }

        // --- Voice Narration ---
        const speaker = window.speechSynthesis;
        function speak(text) {
            return new Promise(resolve => {
                if (speaker.speaking) {
                    console.error("SpeechSynthesis is already speaking.");
                    resolve();
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 1;
                utterance.rate = 0.9;
                utterance.volume = 1;
                utterance.onend = resolve;
                utterance.onerror = (e) => {
                    console.error("SpeechSynthesis error:", e);
                    resolve(); // Resolve anyway to not break the chain
                };
                speaker.speak(utterance);
            });
        }
        
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // --- Animation Sequence ---
        async function runAnimationSequence() {
            isAnimating = true;
            startBtn.disabled = true;
            downloadBtn.disabled = true;
            
            // Reset UI
            introScreen.classList.remove('visible');
            quizScreen.classList.remove('visible');
            outroScreen.classList.remove('visible');
            quizContent.classList.remove('visible');
            
            // 1. Intro (4 seconds)
            introScreen.classList.add('visible');
            chime.triggerAttackRelease("C5", "2s");
            await delay(4000);
            introScreen.classList.remove('visible');
            await delay(1000);

            // 2. Questions (8 seconds each * 5 = 40 seconds)
            quizScreen.classList.add('visible');

            for (let i = 0; i < quizData.length; i++) {
                await displayQuestion(i);
            }
            
            // 3. Outro (1 second)
            quizScreen.classList.remove('visible');
            await delay(1000);
            outroScreen.classList.add('visible');
            await delay(4000); // Hold outro for a bit
            outroScreen.classList.remove('visible');

            isAnimating = false;
            startBtn.disabled = false;
            downloadBtn.disabled = false;
            
            if (capturer) {
                statusEl.textContent = 'Finalizing video... please wait.';
                capturer.stop();
                capturer.save();
                capturer = null;
                statusEl.textContent = 'Video saved!';
                setTimeout(() => statusEl.textContent = '', 3000);
            }
            Tone.Transport.stop();
        }
        
        async function displayQuestion(index) {
            const item = quizData[index];
            
            // Reset options
            optionElements.forEach(opt => {
                opt.classList.remove('show', 'correct');
            });
            
            questionText.textContent = item.question;
            item.options.forEach((optText, i) => {
                optionElements[i].textContent = optText;
            });
            
            quizContent.classList.add('visible');
            await speak(item.question);
            await delay(500);
            
            for (let i = 0; i < item.options.length; i++) {
                optionElements[i].style.transitionDelay = `${i * 0.2}s`;
                optionElements[i].classList.add('show');
                await speak(`${String.fromCharCode(65 + i)}. ${item.options[i]}`);
                await delay(100);
            }
            
            await delay(1500); // Pause for thought
            
            optionElements[item.answer].classList.add('correct');
            await speak(`The correct answer is. ${item.options[item.answer]}`);
            
            await delay(2000); // Let correct answer sink in
            
            quizContent.classList.remove('visible');
            await delay(500);
        }

        // --- Canvas Background Animation ---
        const canvas = document.getElementById('background-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let containerRect;
        
        function resizeCanvas() {
            containerRect = canvas.getBoundingClientRect();
            canvas.width = containerRect.width;
            canvas.height = containerRect.height;
        }

        function createParticles() {
            particles = [];
            let particleCount = 50;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedX: (Math.random() * 0.4 - 0.2),
                    speedY: (Math.random() * 0.4 - 0.2),
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw mosque silhouette at the bottom
            drawMosque();

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(245, 230, 168, 0.5)';
                ctx.fill();
            });
            
            if (isAnimating && capturer) {
                 capturer.capture(canvas);
            }

            requestAnimationFrame(animateParticles);
        }
        
        function drawMosque() {
            const w = canvas.width;
            const h = canvas.height;
            const baseY = h * 0.95;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
            ctx.lineWidth = 1;

            // Main dome
            ctx.beginPath();
            ctx.moveTo(w * 0.3, baseY);
            ctx.quadraticCurveTo(w * 0.5, h * 0.75, w * 0.7, baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Left minaret
            ctx.fillRect(w * 0.2, h * 0.8, w * 0.05, h * 0.15);
            ctx.beginPath();
            ctx.moveTo(w * 0.19, h*0.8);
            ctx.quadraticCurveTo(w*0.225, h*0.75, w*0.26, h*0.8);
            ctx.fill();
            
            // Right minaret
            ctx.fillRect(w * 0.75, h * 0.8, w * 0.05, h * 0.15);
            ctx.beginPath();
            ctx.moveTo(w * 0.74, h*0.8);
            ctx.quadraticCurveTo(w*0.775, h*0.75, w*0.81, h*0.8);
            ctx.fill();
        }
        
        // --- Event Listeners ---
        startBtn.addEventListener('click', async () => {
            if (isAnimating) return;
            if (Tone.context.state !== 'running') {
                await setupAudio();
            }
            Tone.Transport.start();
            runAnimationSequence();
        });
        
        downloadBtn.addEventListener('click', async () => {
             if (isAnimating) return;
             
             statusEl.textContent = 'Starting recording...';
             capturer = new CCapture({
                 format: 'webm',
                 framerate: 30,
                 verbose: false,
                 quality: 90
             });
             capturer.start();

            if (Tone.context.state !== 'running') {
                await setupAudio();
            }
            Tone.Transport.start();
            runAnimationSequence();
            statusEl.textContent = 'Recording... Animation will play.';
        });

        // --- Initialization ---
        window.addEventListener('load', () => {
            resizeCanvas();
            createParticles();
            animateParticles();
        });
        window.addEventListener('resize', () => {
            resizeCanvas();
            createParticles();
        });

    </script>
</body>
</html>

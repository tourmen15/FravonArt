<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy to Supercar Transformation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        #ui-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        #record-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        #record-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        #record-btn.recording {
            background: #ff3333;
            border-color: #ff3333;
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            pointer-events: none;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-container">
        <button id="record-btn">Download Video</button>
    </div>
    <div id="loading">Loading Engine...</div>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURATION ---
        const SCENE_CONFIG = {
            bgColor: 0x050505,
            floorColor: 0x111111,
            neonColor: 0x00ffff,
            toyColor: 0xff3333, // Red plastic
            supercarColor: 0x111111, // Black chrome
            loopDuration: 12 // Seconds for full loop
        };

        // --- SETUP SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(SCENE_CONFIG.bgColor);
        scene.fog = new THREE.FogExp2(SCENE_CONFIG.bgColor, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(8, 5, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); // preserveDrawingBuffer needed for recorder
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        document.getElementById('loading').style.display = 'none';

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        // Neon/Rim lights
        const blueLight = new THREE.PointLight(0x00aaff, 2, 20);
        blueLight.position.set(-5, 2, -5);
        scene.add(blueLight);

        const pinkLight = new THREE.PointLight(0xff00aa, 2, 20);
        pinkLight.position.set(5, 2, -5);
        scene.add(pinkLight);

        // --- ENVIRONMENT (The Table) ---
        const planeGeometry = new THREE.PlaneGeometry(100, 100);
        const planeMaterial = new THREE.MeshStandardMaterial({ 
            color: SCENE_CONFIG.floorColor,
            roughness: 0.1,
            metalness: 0.5
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        const grid = new THREE.GridHelper(100, 100, 0x333333, 0x111111);
        scene.add(grid);

        // --- THE CAR (PROCEDURAL MODEL) ---
        const carGroup = new THREE.Group();
        scene.add(carGroup);

        // Materials
        // We will mutate this material to shift from Plastic to Metal
        const bodyMaterial = new THREE.MeshStandardMaterial({
            color: SCENE_CONFIG.toyColor,
            roughness: 0.6, // Plastic
            metalness: 0.1
        });

        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x000000,
            roughness: 0.0,
            transmission: 0.2,
            metalness: 0.9,
            clearcoat: 1.0
        });

        const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const rimMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });
        const neonLineMaterial = new THREE.LineBasicMaterial({ color: SCENE_CONFIG.neonColor, transparent: true, opacity: 0 });
        
        // Headlights (Emissive)
        const headlightMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffffff,
            emissiveIntensity: 0
        });

        // 1. Chassis
        const chassisGeo = new THREE.BoxGeometry(1.5, 0.5, 3);
        const chassis = new THREE.Mesh(chassisGeo, bodyMaterial);
        chassis.castShadow = true;
        chassis.position.y = 0.5;
        carGroup.add(chassis);

        // Neon Edges for Chassis
        const edgesGeo = new THREE.EdgesGeometry(chassisGeo);
        const chassisLines = new THREE.LineSegments(edgesGeo, neonLineMaterial);
        chassis.add(chassisLines);

        // 2. Cabin
        const cabinGeo = new THREE.BoxGeometry(1.2, 0.4, 1.5);
        // Make cabin look a bit more aerodynamic (tapered)
        const positionAttribute = cabinGeo.attributes.position;
        for ( let i = 0; i < positionAttribute.count; i ++ ) {
            const y = positionAttribute.getY( i );
            if ( y > 0 ) {
                const z = positionAttribute.getZ( i );
                // Taper the top
                positionAttribute.setX( i, positionAttribute.getX( i ) * 0.8 );
                // Slope the windshield
                if(z > 0) positionAttribute.setZ(i, z * 0.6); 
            }
        }
        cabinGeo.computeVertexNormals();
        
        const cabin = new THREE.Mesh(cabinGeo, glassMaterial);
        cabin.position.set(0, 0.45, -0.2);
        cabin.castShadow = true;
        chassis.add(cabin);

        // 3. Wheels
        const wheels = [];
        function createWheel(x, z) {
            const group = new THREE.Group();
            const tireGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 32);
            tireGeo.rotateZ(Math.PI/2);
            const tire = new THREE.Mesh(tireGeo, wheelMaterial);
            tire.castShadow = true;
            
            const rimGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.31, 16);
            rimGeo.rotateZ(Math.PI/2);
            const rim = new THREE.Mesh(rimGeo, rimMaterial);

            group.add(tire);
            group.add(rim);
            group.position.set(x, 0.35, z);
            carGroup.add(group);
            return group;
        }

        // Initial Wheel Positions (Toy Mode)
        wheels.push(createWheel(0.8, 1.0));  // Front R
        wheels.push(createWheel(-0.8, 1.0)); // Front L
        wheels.push(createWheel(0.8, -1.0)); // Back R
        wheels.push(createWheel(-0.8, -1.0)); // Back L

        // 4. Headlights
        const lightGeo = new THREE.BoxGeometry(0.3, 0.1, 0.1);
        const headLightL = new THREE.Mesh(lightGeo, headlightMat);
        const headLightR = new THREE.Mesh(lightGeo, headlightMat);
        headLightL.position.set(-0.5, 0.0, 1.51);
        headLightR.position.set(0.5, 0.0, 1.51);
        chassis.add(headLightL);
        chassis.add(headLightR);

        // 5. Spoiler (Hidden in Toy mode, expands in Supercar mode)
        const spoilerGeo = new THREE.BoxGeometry(1.4, 0.1, 0.4);
        const spoiler = new THREE.Mesh(spoilerGeo, bodyMaterial);
        spoiler.position.set(0, 0.26, -1.4);
        chassis.add(spoiler);

        // --- PARTICLES SYSTEM ---
        const particleCount = 200;
        const particlesGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSpeeds = [];
        
        for(let i=0; i<particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 10;
            particlePositions[i*3+1] = Math.random() * 5;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 10;
            particleSpeeds.push({
                y: Math.random() * 0.05,
                x: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02
            });
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.05,
            transparent: true,
            opacity: 0.5
        });
        const particleSystem = new THREE.Points(particlesGeo, particleMat);
        scene.add(particleSystem);


        // --- ANIMATION VARIABLES ---
        let time = 0;
        const clock = new THREE.Clock();

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            time += delta;

            // Calculate Cycle (0 to 1)
            // 0 = Start Toy, 0.5 = Full Supercar, 1 = End (Toy)
            const cycleTime = (time % SCENE_CONFIG.loopDuration) / SCENE_CONFIG.loopDuration;
            
            // Use a Sine wave to smooth the transition 
            // Map 0..1 linear to 0..1..0 smooth curve
            let transformFactor = (Math.sin(cycleTime * Math.PI * 2 - Math.PI/2) + 1) / 2;
            
            // --- TRANSFORMATION LOGIC ---

            // 1. Camera Orbit
            const camSpeed = 0.3;
            camera.position.x = Math.sin(time * camSpeed) * 7;
            camera.position.z = Math.cos(time * camSpeed) * 7;
            camera.lookAt(0, 0.5, 0);

            // 2. Scale & Body Morph
            // Toy Scale: 1, Supercar Scale: 1.5
            const targetScale = 1 + (transformFactor * 0.5); 
            carGroup.scale.set(targetScale, targetScale, targetScale);

            // Elongate Chassis for Supercar look
            chassis.scale.z = 1 + (transformFactor * 0.4); // Becomes longer
            chassis.scale.x = 1 + (transformFactor * 0.2); // Becomes wider

            // 3. Wheel Position (Wheelbase expansion)
            const expansion = transformFactor * 0.5;
            wheels[0].position.x = 0.8 + expansion; wheels[0].position.z = 1.0 + expansion;
            wheels[1].position.x = -0.8 - expansion; wheels[1].position.z = 1.0 + expansion;
            wheels[2].position.x = 0.8 + expansion; wheels[2].position.z = -1.0 - expansion;
            wheels[3].position.x = -0.8 - expansion; wheels[3].position.z = -1.0 - expansion;

            // 4. Spoiler Lift
            spoiler.position.y = 0.26 + (transformFactor * 0.3);
            spoiler.rotation.x = transformFactor * 0.2; // Tilt

            // 5. Material Transformation (Plastic -> Chrome)
            const colorToy = new THREE.Color(SCENE_CONFIG.toyColor);
            const colorSuper = new THREE.Color(SCENE_CONFIG.supercarColor);
            
            bodyMaterial.color.lerpColors(colorToy, colorSuper, transformFactor);
            bodyMaterial.roughness = THREE.MathUtils.lerp(0.6, 0.05, transformFactor);
            bodyMaterial.metalness = THREE.MathUtils.lerp(0.1, 1.0, transformFactor);

            // 6. Neon Outlines & Lights
            // Lines visible during transition, fade out at perfect states? 
            // Let's keep them pulsating based on transform
            neonLineMaterial.opacity = transformFactor; // More visible as it becomes "Cyber"
            
            // Headlights turn on past 50% transformation
            const lightIntensity = Math.max(0, (transformFactor - 0.5) * 2);
            headlightMat.emissiveIntensity = lightIntensity * 20;

            // 7. Exhaust / Engine Shake (Subtle vibration when full supercar)
            if(transformFactor > 0.8) {
                const shake = (Math.random() - 0.5) * 0.02;
                chassis.position.x = shake;
            } else {
                chassis.position.x = 0;
            }

            // --- PARTICLE UPDATE ---
            const positions = particleSystem.geometry.attributes.position.array;
            for(let i=0; i<particleCount; i++) {
                positions[i*3+1] += particleSpeeds[i].y; // Move up
                // Reset if too high
                if(positions[i*3+1] > 5) positions[i*3+1] = 0;
                
                // Swirl
                positions[i*3] += Math.sin(time + i) * 0.01;
                positions[i*3+2] += Math.cos(time + i) * 0.01;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();


        // --- VIDEO RECORDING LOGIC (MediaRecorder) ---
        const btn = document.getElementById('record-btn');
        let recorder;
        let chunks = [];

        btn.addEventListener('click', () => {
            if (btn.classList.contains('recording')) return;

            startRecording();
        });

        function startRecording() {
            const stream = document.querySelector('canvas').captureStream(60); // 60 FPS
            
            // Check supported mime types
            let mimeType = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm;codecs=vp8'; // Fallback
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/webm';
                }
            }

            recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 5000000 });
            
            chunks = [];
            recorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            recorder.onstop = saveVideo;

            recorder.start();
            btn.textContent = "Recording...";
            btn.classList.add('recording');

            // Record for 6 seconds (half loop is roughly enough to see transition)
            // Or record 1 full loop (12 seconds)
            setTimeout(() => {
                recorder.stop();
                btn.textContent = "Download Video";
                btn.classList.remove('recording');
            }, SCENE_CONFIG.loopDuration * 1000); // Record one full loop
        }

        function saveVideo() {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'animation.webm';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            
            // Reset button text after brief delay
            setTimeout(() => {
                btn.textContent = "Download Video";
            }, 2000);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>

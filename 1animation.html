<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy to Supercar Transformation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; }
        canvas { display: block; }
        
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through except for button */
        }

        #record-btn {
            pointer-events: auto;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            transition: all 0.3s ease;
            outline: none;
        }

        #record-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.8);
        }

        #record-btn.recording {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 65, 108, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 65, 108, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 65, 108, 0); }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <button id="record-btn">Download Video (15s)</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(8, 5, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const mainSpot = new THREE.SpotLight(0xffffff, 2);
        mainSpot.position.set(10, 20, 10);
        mainSpot.castShadow = true;
        mainSpot.shadow.mapSize.width = 2048;
        mainSpot.shadow.mapSize.height = 2048;
        scene.add(mainSpot);

        // Cinematic Blue Rim Light
        const blueLight = new THREE.PointLight(0x0088ff, 2, 20);
        blueLight.position.set(-5, 2, -5);
        scene.add(blueLight);

        // Warm Rim Light
        const warmLight = new THREE.PointLight(0xffaa00, 1, 20);
        warmLight.position.set(5, 2, 5);
        scene.add(warmLight);

        // --- MATERIALS ---
        // We will modify these properties during animation
        const paintMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xff0000, // Toy Red
            metalness: 0.0, // Plastic
            roughness: 0.4, // Slightly glossy plastic
            clearcoat: 0.5,
            clearcoatRoughness: 0.1
        });

        const darkMaterial = new THREE.MeshStandardMaterial({
            color: 0x111111,
            metalness: 0.0,
            roughness: 0.8
        });

        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0
        });

        const outlineMaterial = new THREE.LineBasicMaterial({ 
            color: 0x00ffff, 
            transparent: true, 
            opacity: 0,
            blending: THREE.AdditiveBlending
        });

        // --- GEOMETRY CONSTRUCTION (PROCEDURAL CAR) ---
        const carGroup = new THREE.Group();
        scene.add(carGroup);

        // 1. Main Chassis
        const chassisGeo = new THREE.BoxGeometry(1.8, 0.5, 4);
        const chassis = new THREE.Mesh(chassisGeo, paintMaterial);
        chassis.castShadow = true;
        chassis.position.y = 0.5;
        carGroup.add(chassis);

        // Add Outline to Chassis
        const edges = new THREE.EdgesGeometry(chassisGeo);
        const lineLoop = new THREE.LineSegments(edges, outlineMaterial);
        chassis.add(lineLoop);

        // 2. Cabin (Top)
        const cabinGeo = new THREE.BoxGeometry(1.4, 0.4, 2);
        const cabin = new THREE.Mesh(cabinGeo, darkMaterial);
        cabin.position.set(0, 0.5, -0.2);
        cabin.castShadow = true;
        chassis.add(cabin);

        // 3. Side Panels (Expandable)
        const panelGeo = new THREE.BoxGeometry(0.2, 0.4, 2.5);
        const leftPanel = new THREE.Mesh(panelGeo, paintMaterial);
        const rightPanel = new THREE.Mesh(panelGeo, paintMaterial);
        leftPanel.position.set(-1.0, 0, 0);
        rightPanel.position.set(1.0, 0, 0);
        chassis.add(leftPanel);
        chassis.add(rightPanel);

        // 4. Spoiler (Pop up)
        const spoilerGeo = new THREE.BoxGeometry(2, 0.1, 0.5);
        const spoiler = new THREE.Mesh(spoilerGeo, paintMaterial);
        spoiler.position.set(0, 0.3, 1.8);
        chassis.add(spoiler);

        // 5. Headlights
        const lightGeo = new THREE.BoxGeometry(0.4, 0.1, 0.1);
        const leftLight = new THREE.Mesh(lightGeo, glowMaterial);
        const rightLight = new THREE.Mesh(lightGeo, glowMaterial);
        leftLight.position.set(-0.6, 0.1, -2.01);
        rightLight.position.set(0.6, 0.1, -2.01);
        chassis.add(leftLight);
        chassis.add(rightLight);

        // 6. Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 32);
        wheelGeo.rotateZ(Math.PI / 2);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        
        const wheels = [];
        function createWheel(x, z) {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.position.set(x, 0.4, z);
            w.castShadow = true;
            carGroup.add(w);
            wheels.push(w);
            return w;
        }
        createWheel(-1, -1.2);
        createWheel(1, -1.2);
        createWheel(-1, 1.2);
        createWheel(1, 1.2);

        // --- ENVIRONMENT (REFLECTIVE FLOOR) ---
        const planeGeo = new THREE.PlaneGeometry(50, 50);
        const planeMat = new THREE.MeshStandardMaterial({ 
            color: 0x101010, 
            metalness: 0.8, 
            roughness: 0.1 
        });
        const floor = new THREE.Mesh(planeGeo, planeMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- PARTICLE SYSTEM (EXHAUST) ---
        const particleCount = 100;
        const particlesGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pVel = []; // Velocity storage
        
        for(let i=0; i<particleCount; i++) {
            pPos[i*3] = 0; pPos[i*3+1] = 0; pPos[i*3+2] = 0;
            pVel.push({x:0, y:0, z:0, life: 0});
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        
        const particleMat = new THREE.PointsMaterial({
            color: 0x00aaff,
            size: 0.1,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
        });
        const particleSystem = new THREE.Points(particlesGeo, particleMat);
        scene.add(particleSystem);

        // --- ANIMATION VARIABLES ---
        let time = 0;
        const duration = 8; // Seconds for full loop
        
        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            const dt = 0.016;
            time += dt;
            
            // Normalized time (0 to 1) over the loop duration
            let t = (time % duration) / duration;
            
            // Animation Phases based on 't'
            // 0.0 - 0.15: Toy Idle
            // 0.15 - 0.4: Transform (Expand)
            // 0.4 - 0.6: Supercar Idle (Rev)
            // 0.6 - 0.85: Transform (Shrink)
            // 0.85 - 1.0: Toy Idle

            let morphFactor = 0;
            
            if (t > 0.15 && t <= 0.4) {
                morphFactor = (t - 0.15) / 0.25; // 0 to 1
                morphFactor = easeInOutCubic(morphFactor);
            } else if (t > 0.4 && t <= 0.6) {
                morphFactor = 1;
            } else if (t > 0.6 && t <= 0.85) {
                morphFactor = 1 - ((t - 0.6) / 0.25); // 1 to 0
                morphFactor = easeInOutCubic(morphFactor);
            }

            // 1. Camera Orbit
            const camRadius = 9 + (morphFactor * 3); // Camera pulls back as car grows
            const camSpeed = time * 0.5;
            camera.position.x = Math.cos(camSpeed) * camRadius;
            camera.position.z = Math.sin(camSpeed) * camRadius;
            camera.lookAt(0, 1 + morphFactor, 0);

            // 2. Material Transition (Plastic -> Chrome/Carbon)
            paintMaterial.metalness = morphFactor; // 0 -> 1
            paintMaterial.roughness = 0.4 - (morphFactor * 0.3); // 0.4 -> 0.1
            paintMaterial.color.setHSL(0, 1, 0.5 - (morphFactor * 0.4)); // Red -> Dark Metallic
            
            // 3. Geometry Transformation
            const scale = 1 + morphFactor; // 1x to 2x scale
            carGroup.scale.setScalar(scale);
            
            // Expand Parts
            leftPanel.position.x = -1.0 - (morphFactor * 0.3);
            rightPanel.position.x = 1.0 + (morphFactor * 0.3);
            spoiler.position.y = 0.3 + (morphFactor * 0.4); // Spoiler rises
            
            // Wheels widen
            wheels[0].position.x = (-1 - (morphFactor * 0.4));
            wheels[1].position.x = (1 + (morphFactor * 0.4));
            wheels[2].position.x = (-1 - (morphFactor * 0.4));
            wheels[3].position.x = (1 + (morphFactor * 0.4));

            // 4. Neon/Hologram Outline
            // Flash outline at start of transformation
            let outlineOpacity = 0;
            if(t > 0.1 && t < 0.2) outlineOpacity = (t - 0.1) * 10; 
            if(t >= 0.2 && t < 0.4) outlineOpacity = 1 - ((t - 0.2) * 5);
            outlineMaterial.opacity = outlineOpacity;

            // 5. Lights Glow
            glowMaterial.opacity = morphFactor;

            // 6. Exhaust Particles
            // Only emit when full supercar (0.4 - 0.6)
            if (morphFactor > 0.9) {
                particleMat.opacity = 0.8;
                updateParticles(true, scale);
                // Slight vibration (Engine Rev)
                carGroup.position.y = (Math.sin(time * 50) * 0.02 * scale);
            } else {
                particleMat.opacity *= 0.95; // Fade out
                updateParticles(false, scale);
                carGroup.position.y = 0;
            }

            renderer.render(scene, camera);
        }

        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        function updateParticles(emitting, scale) {
            const positions = particleSystem.geometry.attributes.position.array;
            
            for(let i=0; i < particleCount; i++) {
                const ix = i * 3;
                
                // Update physics
                positions[ix] += pVel[i].x;
                positions[ix+1] += pVel[i].y;
                positions[ix+2] += pVel[i].z;
                pVel[i].life -= 0.02;

                // Reset if dead and emitting
                if (pVel[i].life <= 0 && emitting) {
                    positions[ix] = (Math.random() - 0.5) * 0.5 * scale; // x near center
                    positions[ix+1] = 0.5 * scale; // y exhaust height
                    positions[ix+2] = 2.0 * scale; // z back of car
                    
                    pVel[i].x = (Math.random() - 0.5) * 0.05;
                    pVel[i].y = (Math.random() * 0.05);
                    pVel[i].z = 0.1 + Math.random() * 0.1; // Shoot back
                    pVel[i].life = 1.0;
                } else if (pVel[i].life <= 0) {
                    // Hide
                    positions[ix+1] = -1000; 
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
        }

        animate();

        // --- RECORDING FUNCTIONALITY ---
        const btn = document.getElementById('record-btn');
        
        btn.addEventListener('click', () => {
            if (btn.classList.contains('recording')) return;

            startRecording();
        });

        function startRecording() {
            btn.textContent = "Recording...";
            btn.classList.add('recording');

            const canvas = document.querySelector('canvas');
            // Capture stream at 60 FPS
            const stream = canvas.captureStream(60);
            
            // Prefer VP9 for high quality, fallback to VP8
            const mimeTypes = ['video/webm; codecs=vp9', 'video/webm; codecs=vp8', 'video/webm'];
            let selectedMime = mimeTypes.find(mime => MediaRecorder.isTypeSupported(mime));

            const recorder = new MediaRecorder(stream, {
                mimeType: selectedMime,
                videoBitsPerSecond: 25000000 // 25 Mbps for high quality
            });

            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'supercar_transform.webm';
                a.click();
                URL.revokeObjectURL(url);
                
                btn.textContent = "Download Video (15s)";
                btn.classList.remove('recording');
            };

            recorder.start();

            // Record for 15 seconds (approx 2 loops)
            setTimeout(() => {
                recorder.stop();
            }, 15000);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

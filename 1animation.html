<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Car to Supercar Transformation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #ui-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            pointer-events: auto;
        }
        
        button {
            background: rgba(0, 30, 60, 0.7);
            color: white;
            border: 1px solid rgba(100, 150, 255, 0.5);
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        button:hover {
            background: rgba(0, 50, 100, 0.8);
            border-color: rgba(100, 180, 255, 0.8);
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        #recording-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            backdrop-filter: blur(5px);
        }
        
        #title {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: 300;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.7);
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            font-size: 18px;
        }
        
        .progress-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #0066ff, #00ccff);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-container">
        <div id="title">Toy Car to Supercar Transformation</div>
        <div id="recording-indicator">● RECORDING</div>
        <div id="controls">
            <button id="record-btn">Record Animation</button>
            <button id="download-btn" disabled>Download Video</button>
        </div>
    </div>
    
    <div id="loading">
        <div>Loading 3D Scene...</div>
        <div class="progress-bar">
            <div class="progress" id="progress-bar"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Main application variables
        let scene, camera, renderer, car, table;
        let clock = new THREE.Clock();
        let isRecording = false;
        let mediaRecorder;
        let recordedChunks = [];
        let animationPhase = 0; // 0: Toy car, 1: Transforming, 2: Supercar, 3: Reverting
        let transformProgress = 0;
        let cameraOrbitRadius = 5;
        let cameraOrbitAngle = 0;
        let carScale = 1;
        let carMaterials = [];
        let outlinePass;
        let composer;
        let particleSystem;
        
        // Initialize the scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.Fog(0x050510, 10, 25);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 8);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.physicallyCorrectLights = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Add lighting
            setupLighting();
            
            // Create environment
            createEnvironment();
            
            // Create the car
            createCar();
            
            // Create particle system
            createParticles();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Setup recording functionality
            setupRecording();
            
            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 1500);
            
            // Start animation loop
            animate();
        }
        
        function setupLighting() {
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0x404060, 0.3);
            scene.add(ambientLight);
            
            // Main directional light (simulating soft cinematic lighting)
            const mainLight = new THREE.DirectionalLight(0xfff0e0, 1.2);
            mainLight.position.set(5, 10, 7);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 50;
            mainLight.shadow.camera.left = -10;
            mainLight.shadow.camera.right = 10;
            mainLight.shadow.camera.top = 10;
            mainLight.shadow.camera.bottom = -10;
            scene.add(mainLight);
            
            // Fill light
            const fillLight = new THREE.DirectionalLight(0x4060ff, 0.4);
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);
            
            // Rim light
            const rimLight = new THREE.DirectionalLight(0xff60a0, 0.5);
            rimLight.position.set(0, 5, -10);
            scene.add(rimLight);
        }
        
        function createEnvironment() {
            // Create reflective table surface
            const tableGeometry = new THREE.CylinderGeometry(6, 7, 0.5, 32);
            const tableMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x202030,
                metalness: 0.1,
                roughness: 0.05,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                reflectivity: 1.0
            });
            
            table = new THREE.Mesh(tableGeometry, tableMaterial);
            table.position.y = -1;
            table.receiveShadow = true;
            scene.add(table);
            
            // Add subtle environment reflection
            const cubeTextureLoader = new THREE.CubeTextureLoader();
            const envMap = cubeTextureLoader.load([
                'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
                'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
                'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
                'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
                'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
                'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='
            ]);
            scene.background = envMap;
            scene.environment = envMap;
        }
        
        function createCar() {
            // Create a group to hold the car
            car = new THREE.Group();
            scene.add(car);
            
            // Car body - starting as a simple toy car shape
            const bodyGeometry = new THREE.BoxGeometry(2, 0.5, 4);
            const toyMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xff3366,
                metalness: 0.1,
                roughness: 0.8,
                clearcoat: 0.5,
                clearcoatRoughness: 0.3
            });
            
            const carBody = new THREE.Mesh(bodyGeometry, toyMaterial);
            carBody.castShadow = true;
            carBody.receiveShadow = true;
            car.add(carBody);
            
            // Car cabin
            const cabinGeometry = new THREE.BoxGeometry(1.5, 0.6, 1.5);
            const cabin = new THREE.Mesh(cabinGeometry, toyMaterial);
            cabin.position.y = 0.55;
            cabin.position.z = -0.5;
            cabin.castShadow = true;
            car.add(cabin);
            
            // Wheels
            const wheelGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
            const wheelMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x333333,
                metalness: 0.3,
                roughness: 0.7
            });
            
            for (let i = 0; i < 4; i++) {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                
                if (i < 2) {
                    wheel.position.set(i === 0 ? -0.8 : 0.8, -0.25, -1.2);
                } else {
                    wheel.position.set(i === 2 ? -0.8 : 0.8, -0.25, 1.2);
                }
                
                wheel.castShadow = true;
                car.add(wheel);
            }
            
            // Store materials for transformation
            carMaterials.push(toyMaterial);
            carMaterials.push(wheelMaterial);
            
            // Position the car
            car.position.y = 0.5;
        }
        
        function createParticles() {
            const particleCount = 100;
            const particles = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                // Random positions around the car
                positions[i3] = (Math.random() - 0.5) * 10;
                positions[i3 + 1] = Math.random() * 5;
                positions[i3 + 2] = (Math.random() - 0.5) * 10;
                
                // Blue-ish colors
                colors[i3] = 0.2 + Math.random() * 0.3;
                colors[i3 + 1] = 0.5 + Math.random() * 0.5;
                colors[i3 + 2] = 0.8 + Math.random() * 0.2;
            }
            
            particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const particleMaterial = new THREE.PointsMaterial({
                size: 0.05,
                vertexColors: true,
                transparent: true,
                opacity: 0.6
            });
            
            particleSystem = new THREE.Points(particles, particleMaterial);
            scene.add(particleSystem);
        }
        
        function animateParticles() {
            const positions = particleSystem.geometry.attributes.position.array;
            
            for (let i = 0; i < positions.length; i += 3) {
                // Simple floating animation
                positions[i + 1] += 0.005;
                
                // Reset particles that go too high
                if (positions[i + 1] > 5) {
                    positions[i + 1] = 0;
                    positions[i] = (Math.random() - 0.5) * 10;
                    positions[i + 2] = (Math.random() - 0.5) * 10;
                }
            }
            
            particleSystem.geometry.attributes.position.needsUpdate = true;
        }
        
        function updateTransformation() {
            const delta = clock.getDelta();
            
            // Update animation phase
            if (animationPhase === 0) {
                // Toy car phase - just orbiting camera
                transformProgress = 0;
                cameraOrbitAngle += delta * 0.2;
                
                // After a while, start transformation
                if (cameraOrbitAngle > Math.PI * 2) {
                    animationPhase = 1;
                    cameraOrbitAngle = 0;
                }
            } else if (animationPhase === 1) {
                // Transformation phase
                transformProgress += delta * 0.2;
                
                if (transformProgress >= 1) {
                    transformProgress = 1;
                    animationPhase = 2;
                    
                    // Simulate exhaust burst
                    setTimeout(() => {
                        // Camera pull back
                        cameraOrbitRadius = 8;
                    }, 500);
                }
            } else if (animationPhase === 2) {
                // Supercar phase - hold for a moment
                transformProgress = 1;
                cameraOrbitAngle += delta * 0.1;
                
                // After a while, start reverting
                if (cameraOrbitAngle > Math.PI) {
                    animationPhase = 3;
                }
            } else if (animationPhase === 3) {
                // Reverting phase
                transformProgress -= delta * 0.2;
                
                if (transformProgress <= 0) {
                    transformProgress = 0;
                    animationPhase = 0;
                    cameraOrbitRadius = 5;
                }
            }
            
            // Apply transformation to car
            carScale = 0.5 + transformProgress * 1.5;
            car.scale.set(carScale, carScale, carScale);
            
            // Update materials based on transformation progress
            carMaterials.forEach(material => {
                if (material === carMaterials[0]) { // Body material
                    material.color.lerp(new THREE.Color(
                        transformProgress > 0.5 ? 0x0066ff : 0xff3366
                    ), delta * 2);
                    material.metalness = 0.1 + transformProgress * 0.8;
                    material.roughness = 0.8 - transformProgress * 0.7;
                    material.clearcoat = 0.5 + transformProgress * 0.5;
                }
            });
            
            // Update camera position based on orbit
            camera.position.x = Math.sin(cameraOrbitAngle) * cameraOrbitRadius;
            camera.position.z = Math.cos(cameraOrbitAngle) * cameraOrbitRadius;
            camera.position.y = 2 + Math.sin(cameraOrbitAngle * 0.5) * 0.5;
            camera.lookAt(0, 0.5, 0);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            updateTransformation();
            animateParticles();
            
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Recording functionality
        function setupRecording() {
            const recordBtn = document.getElementById('record-btn');
            const downloadBtn = document.getElementById('download-btn');
            const recordingIndicator = document.getElementById('recording-indicator');
            
            recordBtn.addEventListener('click', startRecording);
            downloadBtn.addEventListener('click', downloadRecording);
        }
        
        function startRecording() {
            if (isRecording) return;
            
            const recordBtn = document.getElementById('record-btn');
            const downloadBtn = document.getElementById('download-btn');
            const recordingIndicator = document.getElementById('recording-indicator');
            
            isRecording = true;
            recordedChunks = [];
            recordBtn.disabled = true;
            recordingIndicator.style.display = 'block';
            
            // Get the canvas stream
            const canvasStream = renderer.domElement.captureStream(60);
            
            // Set up media recorder
            const options = {
                mimeType: 'video/webm; codecs=vp9',
                videoBitsPerSecond: 8000000 // 8 Mbps for high quality
            };
            
            try {
                mediaRecorder = new MediaRecorder(canvasStream, options);
            } catch (e) {
                console.error('MediaRecorder error:', e);
                // Fallback to VP8
                options.mimeType = 'video/webm; codecs=vp8';
                try {
                    mediaRecorder = new MediaRecorder(canvasStream, options);
                } catch (e2) {
                    console.error('MediaRecorder fallback error:', e2);
                    alert('Recording not supported in this browser');
                    resetRecordingState();
                    return;
                }
            }
            
            mediaRecorder.ondataavailable = handleDataAvailable;
            mediaRecorder.onstop = handleStop;
            
            // Start recording
            mediaRecorder.start();
            
            // Stop recording after 15 seconds
            setTimeout(() => {
                if (isRecording) {
                    mediaRecorder.stop();
                    isRecording = false;
                    recordingIndicator.style.display = 'none';
                    downloadBtn.disabled = false;
                }
            }, 15000);
        }
        
        function handleDataAvailable(event) {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        }
        
        function handleStop() {
            recordBtn.disabled = false;
        }
        
        function downloadRecording() {
            const blob = new Blob(recordedChunks, {
                type: 'video/webm'
            });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'car-transformation.webm';
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }
        
        function resetRecordingState() {
            isRecording = false;
            recordBtn.disabled = false;
            recordingIndicator.style.display = 'none';
        }
        
        // Simulate loading progress
        function simulateLoading() {
            const progressBar = document.getElementById('progress-bar');
            let width = 0;
            
            const interval = setInterval(() => {
                width += Math.random() * 10;
                if (width >= 100) {
                    width = 100;
                    clearInterval(interval);
                }
                progressBar.style.width = width + '%';
            }, 200);
        }
        
        // Start the application
        simulateLoading();
        window.onload = init;
    </script>
</body>
</html>

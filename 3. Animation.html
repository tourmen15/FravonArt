<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paper Plane to Fighter Jet Transformation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky Blue */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #000022, #0f204b); /* Space/High Altitude */
        }

        canvas {
            display: block;
            /* Force aspect ratio in view, but internal resolution handles quality */
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="ui">Rendering: 1920x1080 @ 60fps | Cycle: 10s</div>

<script>
    // --- 1. SETUP SCENE & RENDERER ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Fog for depth and speed illusion
    scene.fog = new THREE.FogExp2(0x0f204b, 0.002);

    const camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    // Force 1080p Resolution
    renderer.setSize(1920, 1080);
    renderer.setPixelRatio(window.devicePixelRatio); // Ensure crisp edges
    
    // Handle resizing strictly to aspect ratio visual, but keeping 1080p buffer
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // --- 2. MODEL GENERATION ---

    // A. The Paper Plane
    function createPaperPlane() {
        const geometry = new THREE.BufferGeometry();
        // Simple dart shape vertices
        const vertices = new Float32Array([
            0, 0, 2,    // Nose
            1, 0, -1,   // Right Wing tip
            0, -0.5, -1,// Bottom keel
            
            0, 0, 2,    // Nose
            0, -0.5, -1,// Bottom keel
            -1, 0, -1,  // Left Wing tip
            
            0, 0, 2,    // Nose
            -1, 0, -1,  // Left Wing tip
            0, 0.2, -1, // Top ridge
            
            0, 0, 2,    // Nose
            0, 0.2, -1, // Top ridge
            1, 0, -1    // Right Wing tip
        ]);
        geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        geometry.computeVertexNormals();
        
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            roughness: 0.4,
            side: THREE.DoubleSide
        });
        const plane = new THREE.Mesh(geometry, material);
        return plane;
    }

    // B. The Fighter Jet (Procedural Group)
    function createFighterJet() {
        const jetGroup = new THREE.Group();
        const hullMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.2, metalness: 0.8 });
        const cockpitMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.8 });
        const engineMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });

        // Fuselage
        const bodyGeo = new THREE.ConeGeometry(0.8, 6, 8);
        const body = new THREE.Mesh(bodyGeo, hullMat);
        body.rotation.x = -Math.PI / 2;
        jetGroup.add(body);

        // Cockpit
        const cockpitGeo = new THREE.BoxGeometry(0.6, 0.5, 1.5);
        const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
        cockpit.position.set(0, 0.5, 0.5);
        jetGroup.add(cockpit);

        // Wings
        const wingGeo = new THREE.BoxGeometry(4, 0.1, 1.5);
        const wings = new THREE.Mesh(wingGeo, hullMat);
        wings.position.set(0, 0, -0.5);
        // Sweep wings back
        const geometry = new THREE.Geometry(); // Using older logic for simplicity in shape, but let's stick to primitives
        // Simple Delta wings using scaling
        const leftWing = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 4), hullMat);
        leftWing.scale.set(1, 0.1, 1);
        leftWing.position.set(-1.2, 0, -1);
        leftWing.rotation.z = 0.5;
        leftWing.rotation.x = -Math.PI/2;
        jetGroup.add(leftWing);

        const rightWing = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 4), hullMat);
        rightWing.scale.set(1, 0.1, 1);
        rightWing.position.set(1.2, 0, -1);
        rightWing.rotation.z = -0.5;
        rightWing.rotation.x = -Math.PI/2;
        jetGroup.add(rightWing);

        // Tail Fins
        const tailL = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 4), hullMat);
        tailL.position.set(-0.5, 0.5, -2.5);
        tailL.rotation.x = -0.5;
        jetGroup.add(tailL);

        const tailR = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 4), hullMat);
        tailR.position.set(0.5, 0.5, -2.5);
        tailR.rotation.x = -0.5;
        jetGroup.add(tailR);

        // Engine Glows
        const engL = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.1, 0.5, 8), engineMat);
        engL.rotation.x = Math.PI/2;
        engL.position.set(-0.6, 0, -3.2);
        jetGroup.add(engL);

        const engR = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.1, 0.5, 8), engineMat);
        engR.rotation.x = Math.PI/2;
        engR.position.set(0.6, 0, -3.2);
        jetGroup.add(engR);

        return jetGroup;
    }

    // C. Speed Particles (Stars/Dust)
    function createParticles() {
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        for (let i = 0; i < 1000; i++) {
            vertices.push(
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 200
            );
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 });
        return new THREE.Points(geometry, material);
    }

    // --- 3. SCENE COMPOSITION ---

    const mainGroup = new THREE.Group();
    scene.add(mainGroup);

    const paperPlane = createPaperPlane();
    mainGroup.add(paperPlane);

    const fighterJet = createFighterJet();
    fighterJet.visible = false; // Hidden initially
    fighterJet.scale.set(0.1, 0.1, 0.1);
    mainGroup.add(fighterJet);

    const particles = createParticles();
    scene.add(particles);

    // Camera Positioning
    camera.position.set(0, 2, 8);
    camera.lookAt(0, 0, 0);

    // --- 4. ANIMATION LOGIC ---

    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });

    function runAnimationSequence() {
        // Reset State
        paperPlane.visible = true;
        paperPlane.rotation.set(0,0,0);
        fighterJet.visible = false;
        fighterJet.rotation.set(0,0,0);
        fighterJet.scale.set(0.1, 0.1, 0.1);
        mainGroup.position.set(0,0,0);
        camera.fov = 60;
        camera.updateProjectionMatrix();

        // 1. Paper Plane Float (0s - 3s)
        tl.to(paperPlane.rotation, { z: 0.2, duration: 1, ease: "sine.inOut" })
          .to(paperPlane.rotation, { z: -0.2, duration: 1, ease: "sine.inOut" })
          .to(paperPlane.rotation, { z: 0, duration: 1, ease: "sine.inOut" });

        // 2. Barrel Roll & Speed Up (3s - 5s)
        tl.to(paperPlane.rotation, { z: Math.PI * 2, duration: 1.5, ease: "power2.in" }, "-=0.5");
        tl.to(camera.position, { z: 5, duration: 2, ease: "power2.in" }, "<"); // Camera gets closer

        // 3. The Transformation (Swap)
        tl.call(() => {
            paperPlane.visible = false;
            fighterJet.visible = true;
        });

        // 4. Jet Explosion/Reveal
        tl.to(fighterJet.scale, { x: 1, y: 1, z: 1, duration: 0.5, ease: "elastic.out(1, 0.5)" });
        
        // Warp Speed Effect (FOV trick)
        tl.to(camera, { fov: 90, duration: 0.2, onUpdate: () => camera.updateProjectionMatrix() }, "<");
        
        // 5. Jet Flyoff
        tl.to(mainGroup.position, { z: -200, duration: 2, ease: "power4.in" });
        
        // Reset FOV slowly after flyoff
        tl.to(camera, { fov: 60, duration: 1, onUpdate: () => camera.updateProjectionMatrix() });
    }

    // Start the sequence
    runAnimationSequence();

    // --- 5. RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();

        // Move particles to simulate speed
        const positions = particles.geometry.attributes.position.array;
        for (let i = 2; i < positions.length; i += 3) {
            positions[i] += 20 * delta; // Speed towards camera
            if (positions[i] > 50) {
                positions[i] = -150; // Reset to back
            }
        }
        particles.geometry.attributes.position.needsUpdate = true;

        // Add slight idle hover to the whole group
        mainGroup.position.y = Math.sin(clock.getElapsedTime() * 2) * 0.2;

        renderer.render(scene, camera);
    }

    // Window Resize Handling (Maintains aspect ratio of projection, fits window)
    window.addEventListener('resize', () => {
        // Note: We don't change renderer.setSize here to keep the 1080p requirement strict
        // We only update CSS logic implicitly by the container
        // But we must update camera aspect to prevent distortion if window shape changes
        const width = container.clientWidth;
        const height = container.clientHeight;
        // Adjust camera aspect only if we wanted responsive sizing, 
        // but user asked for specific resolution. 
        // Ideally, we keep 16:9. If window isn't 16:9, CSS handles black bars or fit.
    });

    animate();

</script>
</body>
</html>

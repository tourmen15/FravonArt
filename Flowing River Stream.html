<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flowing River Stream — Production-ready</title>
  <style>
    :root{
      --deep:#1B3C59; --teal:#2C5F77; --sky:#A3D9FF; --shimmer:#E5E5E5; --sun:#FFD99F; --green:#739572;
      --ui-bg: #0b0f12; --card-bg: rgba(255,255,255,0.02);
    }
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue';background:linear-gradient(180deg,#07121a 0%, #0b1822 100%);color:#eaf6ff}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box}
    .card{width:100%;max-width:1200px;background:var(--card-bg);border-radius:16px;padding:22px;box-shadow:0 6px 30px rgba(2,8,15,0.6);backdrop-filter:blur(6px);}
    header{display:flex;align-items:center;gap:16px}
    .title{font-size:20px;font-weight:700}
    .subtitle{opacity:0.8;font-size:13px}
    .player{display:flex;flex-direction:column;align-items:center;margin-top:18px}
    .stage{width:100%;aspect-ratio:16/9;max-height:640px;background:linear-gradient(180deg, rgba(10,25,35,0.6), rgba(2,8,12,0.6));border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    canvas{width:100%;height:100%;display:block}
    .controls{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap;justify-content:center}
    .select{padding:8px 12px;background:transparent;border:1px solid rgba(255,255,255,0.06);border-radius:999px;color:inherit}
    .download-btn{background:var(--deep);color:#fff;padding:14px 26px;border-radius:999px;border:none;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(27,60,89,0.28);transform:translateY(0);transition:all .22s;}
    .download-btn:hover{box-shadow:0 10px 30px rgba(27,60,89,0.36);transform:translateY(-3px)}
    .note{font-size:13px;opacity:0.8;margin-top:10px;text-align:center}
    /* small screens: portrait stage */
    @media (max-width:720px){
      .stage{aspect-ratio:9/16;max-height:80vh}
      .card{padding:16px}
    }
    /* subtle entrance */
    .card{opacity:0;transform:translateY(8px);animation:fadeIn .6s ease forwards .08s}
    @keyframes fadeIn{to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <div>
          <div class="title">Flowing River Stream</div>
          <div class="subtitle">Seamless, relaxing, code-generated river animation — 1080p @ 60FPS</div>
        </div>
      </header>

      <div class="player" role="region" aria-label="Flowing river preview">
        <div class="stage">
          <!-- Main canvas shown to user. The actual rendering is resolution-independent; we use an offscreen recorder when creating downloads. -->
          <canvas id="riverCanvas" width="1920" height="1080" style="background:transparent"></canvas>
        </div>

        <div class="controls">
          <label>
            <select id="aspectSelect" class="select" title="Choose aspect ratio to download">
              <option value="1920x1080">1920×1080 (16:9)</option>
              <option value="1080x1920">1080×1920 (9:16)</option>
              <option value="1080x1080">1080×1080 (1:1)</option>
              <option value="1080x1350">1080×1350 (4:5)</option>
            </select>
          </label>

          <button id="downloadBtn" class="download-btn">Free HD Download</button>
        </div>
        <div class="note">Tip: MP4 recording depends on your browser. If MP4 isn't supported, a high-quality WebM will be offered which is visually lossless and converts easily to MP4.</div>
      </div>
    </div>
  </div>

<script>
/*
  Flowing River Stream
  - Single-file, no external assets
  - Uses canvas rendering with value-noise to create flowing water
  - Seamless loop using a fixed LOOP_DURATION (seconds)
  - Downloads by recording an offscreen canvas at the chosen resolution
  Notes on MP4: Browsers differ in MediaRecorder support for 'video/mp4'.
  We attempt MP4, but fall back to high-quality WebM when MP4 isn't available.
*/

// ---------- Config ----------
const LOOP_DURATION = 8; // seconds for a perfect seamless loop
const DISPLAY_FPS = 60;
const CANVAS_W = 1920, CANVAS_H = 1080; // preview canvas internal size (1080p)
const PARTICLE_COUNT = 120;

// Color palette (from user's spec)
const COLORS = {
  deep: '#1B3C59', teal: '#2C5F77', sky:'#A3D9FF', shimmer:'#E5E5E5', sun:'#FFD99F', green:'#739572'
};

// ---------- Setup canvases ----------
const canvas = document.getElementById('riverCanvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_W; canvas.height = CANVAS_H;

// We will use an offscreen buffer for some layers for performance
const buffer = document.createElement('canvas');
buffer.width = CANVAS_W; buffer.height = CANVAS_H;
const bctx = buffer.getContext('2d');

// ---------- Utility: value noise (looping) ----------
// A compact 2D value noise with smooth interpolation. It's built to loop over time using circular mapping.
function lerp(a,b,t){return a + (b-a)*t}
function fade(t){return t*t*(3-2*t)}
// Simple pseudo-random based on integer coords
function rand2(x,y){
  return fract(Math.sin(x*127.1 + y*311.7)*43758.5453);
}
function fract(x){return x - Math.floor(x)}
function valueNoise(x,y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const tl = rand2(xi, yi);
  const tr = rand2(xi+1, yi);
  const bl = rand2(xi, yi+1);
  const br = rand2(xi+1, yi+1);
  const u = fade(xf), v = fade(yf);
  const x1 = lerp(tl, tr, u);
  const x2 = lerp(bl, br, u);
  return lerp(x1, x2, v);
}

// To make noise loop seamlessly in time, map time onto a circle
function loopNoise(x,y,t,period){
  const ang = (t/period) * Math.PI * 2;
  // sample along two points on circle -> average
  const r = 100;
  return valueNoise(x + Math.cos(ang)*r, y + Math.sin(ang)*r);
}

// ---------- River layers ----------
// We'll render several layered ribbons with vertical offsets and noise-based velocity to create depth.

function drawRiver(time){
  // Clear buffer
  bctx.clearRect(0,0,buffer.width,buffer.height);

  // Background gradient (deep water to teal)
  const g = bctx.createLinearGradient(0,0,0,buffer.height);
  g.addColorStop(0, COLORS.teal);
  g.addColorStop(0.6, COLORS.deep);
  bctx.fillStyle = g;
  bctx.fillRect(0,0,buffer.width,buffer.height);

  // Add subtle sky reflection gradient on top
  const skyG = bctx.createLinearGradient(0,0,0,buffer.height);
  skyG.addColorStop(0, 'rgba(163,217,255,0.12)');
  skyG.addColorStop(0.5, 'rgba(163,217,255,0.02)');
  bctx.fillStyle = skyG;
  bctx.fillRect(0,0,buffer.width,buffer.height);

  // Draw layered flowing ribbons
  const layers = 5;
  for(let i=0;i<layers;i++){
    const depth = i/(layers-1); // 0..1
    drawRibbon(bctx, time, depth);
  }

  // Draw shimmer highlights using additive blending
  drawShimmer(bctx, time);

  // Draw particles
  drawParticles(bctx, time);
}

function drawRibbon(ctxR, t, depth){
  // depth: 0=near (bright & fast) to 1=far (darker & slow)
  const h = canvas.height;
  const w = canvas.width;
  const baseY = h * (0.35 + 0.3*depth + Math.sin(t*0.3 + depth*2)*0.02);
  const amplitude = 60 * (1-depth) + 10;
  const speed = 0.6 + (1-depth)*1.6; // near ribbons move faster

  ctxR.beginPath();
  const points = 14;
  for(let i=0;i<=points;i++){
    const x = (i/points) * w;
    // horizontal noise driving vertical displacement
    const n = loopNoise(x*0.008, depth*10, t*speed, LOOP_DURATION);
    const y = baseY + (n-0.5)*amplitude + Math.sin((x/w)*Math.PI*2 + t*0.7*speed)*(18*(1-depth));
    if(i===0) ctxR.moveTo(x,y);
    else ctxR.lineTo(x,y);
  }
  // close shape to bottom
  ctxR.lineTo(w,h);
  ctxR.lineTo(0,h);
  ctxR.closePath();

  // Fill with gradient depending on depth
  const g = ctxR.createLinearGradient(0,baseY-120,0,baseY+120);
  const mix = 0.4 + 0.6*(1-depth);
  function mixColor(a,b,t){
    // a and b are hex colors
    const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
    const ar=(pa>>16)&255, ag=(pa>>8)&255, ab=pa&255;
    const br=(pb>>16)&255, bg=(pb>>8)&255, bb=pb&255;
    const rr=Math.round(ar*(1-t)+br*t), rg=Math.round(ag*(1-t)+bg*t), rb=Math.round(ab*(1-t)+bb*t);
    return `rgb(${rr},${rg},${rb})`;
  }
  const colA = mixColor(COLORS.teal, COLORS.deep, depth*0.7);
  const colB = mixColor(COLORS.sky, COLORS.teal, depth*0.2);
  g.addColorStop(0, colB);
  g.addColorStop(1, colA);
  ctxR.fillStyle = g;
  ctxR.fill();

  // subtle stroke
  ctxR.lineWidth = 1.2*(1-depth) + 0.2;
  ctxR.strokeStyle = 'rgba(255,255,255,'+ (0.02 + (1-depth)*0.035) +')';
  ctxR.stroke();
}

// ---------- Shimmer / highlights ----------
function drawShimmer(ctxS, t){
  const w = ctxS.canvas.width, h = ctxS.canvas.height;
  // Use additive composite for shimmer
  ctxS.save();
  ctxS.globalCompositeOperation = 'lighter';
  for(let i=0;i<28;i++){
    const x = (i/28)*w + Math.sin(t*0.4 + i)*80;
    const y = h*0.45 + Math.cos(t*0.3 + i*0.7)*40 + (i%3)*8;
    const len = 260 + (i%5)*60;
    const grd = ctxS.createLinearGradient(x-len, y, x+len,y);
    grd.addColorStop(0, 'rgba(229,229,229,0)');
    grd.addColorStop(0.48, 'rgba(245,245,245,0.08)');
    grd.addColorStop(0.52, 'rgba(255,217,159,0.06)');
    grd.addColorStop(1, 'rgba(229,229,229,0)');
    ctxS.fillStyle = grd;
    ctxS.beginPath();
    ctxS.ellipse(x, y, len, 28 + Math.sin(t*0.6 + i)*8, 0, 0, Math.PI*2);
    ctxS.fill();
  }
  ctxS.restore();
}

// ---------- Particles (floating debris / light flecks) ----------
const particles = [];
function initParticles(){
  particles.length = 0;
  for(let i=0;i<PARTICLE_COUNT;i++){
    particles.push({
      x: Math.random(), // normalized 0..1
      y: Math.random()*0.9 + 0.05,
      size: 1 + Math.random()*3,
      phase: Math.random()*Math.PI*2,
      speed: 0.02 + Math.random()*0.12,
      alpha: 0.08 + Math.random()*0.28
n    });
  }
}

function drawParticles(ctxP, t){
  ctxP.save();
  for(const p of particles){
    // horizontal flow influenced by noise
    const flow = (loopNoise(p.x*280, p.y*40, t*0.6, LOOP_DURATION)-0.5)*2;
    p.x += (0.001 + p.speed*0.01) + flow*0.0012;
    p.y += Math.sin(t*0.3 + p.phase)*0.0005;
    // wrap
    if(p.x>1.15) p.x = -0.15;
    if(p.x<-0.15) p.x = 1.15;

    const X = Math.floor(p.x * ctxP.canvas.width);
    const Y = Math.floor(p.y * ctxP.canvas.height);
    const s = p.size * (0.6 + Math.sin(p.phase + t*0.7)*0.4);
    ctxP.beginPath();
    ctxP.fillStyle = `rgba(230,245,255,${p.alpha})`;
    ctxP.ellipse(X, Y, s*1.2, s*0.6, Math.sin(p.phase)*0.4, 0, Math.PI*2);
    ctxP.fill();
  }
  ctxP.restore();
}

// ---------- Rendering loop ----------
let startTime = performance.now();
initParticles();

function render(){
  const now = performance.now();
  let t = (now - startTime)/1000; // seconds
  // wrap time into a continuous looping parameter
  const loopT = t % LOOP_DURATION;

  // draw into buffer
  drawRiver(loopT);

  // final composite: copy buffer to visible canvas with slight vignette
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(buffer,0,0);

  // vignette
  const vg = ctx.createRadialGradient(canvas.width*0.5, canvas.height*0.45, canvas.height*0.2, canvas.width*0.5, canvas.height*0.45, canvas.height*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(2,6,10,0.45)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,canvas.width,canvas.height);

  // subtle sun reflection dot
  const sunX = canvas.width*0.15 + Math.sin(loopT*0.4)*60;
  const sunY = canvas.height*0.18 + Math.cos(loopT*0.32)*20;
  ctx.beginPath(); ctx.fillStyle = 'rgba(255,217,159,0.06)'; ctx.ellipse(sunX,sunY,120,36,0,0,Math.PI*2); ctx.fill();

  // request next frame
  requestAnimationFrame(render);
}
// Start rendering
requestAnimationFrame(render);

// ---------- Download / Recording Logic ----------
const downloadBtn = document.getElementById('downloadBtn');
const aspectSelect = document.getElementById('aspectSelect');

async function makeOffscreenCanvas(w,h){
  const oc = document.createElement('canvas');
  oc.width = w; oc.height = h;
  const octx = oc.getContext('2d');

  // We'll draw into this offscreen using scaled versions of our draw functions.
  // Create scaled buffer to render layers at target resolution for recording.
  const renderBuffer = document.createElement('canvas');
  renderBuffer.width = w; renderBuffer.height = h;
  const rctx = renderBuffer.getContext('2d');

  // scale factors to reuse same drawing code but respecting resolution
  const scaleX = w / CANVAS_W, scaleY = h / CANVAS_H;

  // Adapted drawRiver that scales coordinates
  function drawFrame(recordTime){
    // We'll adapt by temporarily scaling the buffer's context
    rctx.setTransform(scaleX,0,0,scaleY,0,0);
    drawRiver(recordTime);
    rctx.setTransform(1,0,0,1,0,0);
    // Now copy renderBuffer to offscreen canvas (with high-res content)
    octx.clearRect(0,0,w,h);
    octx.drawImage(renderBuffer,0,0,w,h);
    return octx;
  }

  return {canvas: oc, ctx: octx, drawFrame};
}

// Attempt to record exactly LOOP_DURATION seconds of video at 60fps and produce a downloadable blob
async function recordAnimation(targetW,targetH){
  // create offscreen renderer
  const off = await makeOffscreenCanvas(targetW,targetH);
  const stream = off.canvas.captureStream(DISPLAY_FPS);

  // Try mp4 mime first (may not be supported)
  const preferred = [ 'video/mp4;codecs="avc1.42E01E"', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm' ];
  let mime = '';
  for(const m of preferred){ if(MediaRecorder.isTypeSupported(m)){ mime = m; break; } }
  if(!mime) mime = '';

  const options = mime? {mimeType: mime, bitsPerSecond: 8_000_000} : {bitsPerSecond:8_000_000};
  let recorder;
  try{ recorder = new MediaRecorder(stream, options); }catch(e){ recorder = new MediaRecorder(stream); }

  const chunks = [];
  recorder.ondataavailable = ev => { if(ev.data && ev.data.size) chunks.push(ev.data); };

  // Start recording
  recorder.start(1000); // gather in small chunks

  // render frames for loop duration
  const start = performance.now();
  let elapsed = 0;
  return new Promise((res,rej)=>{
    function step(now){
      elapsed = (now - start)/1000;
      const t = elapsed % LOOP_DURATION;
      off.drawFrame(t);
      if(elapsed < LOOP_DURATION + 0.03){
        requestAnimationFrame(step);
      }else{
        // stop recorder, finalize
        recorder.onstop = ()=>{
          const blob = new Blob(chunks, {type: mime || recorder.mimeType || 'video/webm'});
          res({blob,mime: blob.type});
        };
        recorder.stop();
      }
    }
    requestAnimationFrame(step);
  });
}

// Helper to download blob
function downloadBlob(blob,filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

// UI handler
downloadBtn.addEventListener('click', async ()=>{
  downloadBtn.disabled = true; downloadBtn.textContent = 'Preparing HD...';
  const val = aspectSelect.value; const [w,h] = val.split('x').map(v=>parseInt(v));
  try{
    // Start recording
    const {blob,mime} = await recordAnimation(w,h);
    // choose extension based on mime
    let ext = '.webm';
    if(mime.includes('mp4') || mime.includes('x-m4v') || mime.includes('quicktime')) ext = '.mp4';
    else if(mime.includes('webm')) ext = '.webm';

    const fname = `Flowing-River-Stream_${w}x${h}${ext}`;
    downloadBlob(blob, fname);
    downloadBtn.textContent = 'Free HD Download';
  }catch(err){
    console.error(err);
    alert('Recording failed in this browser. Try in Chrome or Edge. A fallback will be attempted.');
    downloadBtn.textContent = 'Free HD Download';
  }finally{ downloadBtn.disabled = false; }
});

// Accessibility: keyboard shortcut D to download
window.addEventListener('keydown', e=>{ if((e.key==='d' || e.key==='D') && !e.metaKey && !e.ctrlKey){ downloadBtn.click(); } });

</script>
</body>
</html>

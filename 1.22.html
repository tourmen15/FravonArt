<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Journey Through an Endless Galaxy — 10s 1920×1080 60FPS</title>
<style>
  :root{--bg:#000012;--accent:#6ee7ff}
  html,body{height:100%;margin:0;background:var(--bg);color:#e6eef8;font-family:Inter,system-ui,Arial}
  .wrap{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;padding:12px 16px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);gap:12px}
  .title{font-weight:700}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
  button, select {background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer}
  button.primary{background:linear-gradient(180deg,var(--accent),#10b981);color:#021;border:none}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:6px}
  canvas{width:960px;height:540px;box-shadow:0 12px 40px rgba(0,0,0,0.6);border-radius:6px;background:black}
  footer{padding:12px 16px;font-size:13px;background:linear-gradient(180deg, transparent, rgba(255,255,255,0.01));display:flex;justify-content:space-between;align-items:center;gap:12px}
  .note{font-size:13px;color:#bcd}
  .status{font-size:13px;color:#9be7d3}
  progress{width:320px}
  code{background:#071227;padding:4px 6px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;gap:12px">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden><path d="M12 2v20M2 12h20" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
      <div>
        <div class="title">Journey Through an Endless Galaxy — 10s Loop (1920×1080, 60FPS)</div>
        <div class="note">Perfect loop • Code-only • In-browser MP4 conversion (ffmpeg.wasm)</div>
      </div>
    </div>
    <div class="controls">
      <button id="renderBtn" class="primary">Render & Download MP4 (10s)</button>
      <button id="downloadWebm">Download WebM</button>
      <button id="snapshot">Snapshot PNG</button>
    </div>
  </header>

  <main>
    <canvas id="preview" width="1920" height="1080" aria-label="Galaxy preview"></canvas>
  </main>

  <footer>
    <div class="note">Note: MP4 conversion requires internet (ffmpeg.wasm) and can be CPU-intensive. If conversion fails you will get WebM instead.</div>
    <div style="display:flex;flex-direction:column;align-items:flex-end">
      <div class="status" id="status">Idle</div>
      <progress id="progress" value="0" max="1" style="display:none"></progress>
    </div>
  </footer>
</div>

<script type="module">
import { createFFmpeg, fetchFile } from "https://unpkg.com/@ffmpeg/ffmpeg@0.11.1/dist/ffmpeg.min.mjs";

const DURATION = 10000; // ms
const FPS = 60;
const W = 1920;
const H = 1080;
const CYCLES = 4; // integer cycles for perfect loop
const RINGS = 42;
const BASE_RADIUS = Math.max(W, H) * 0.75;
const PALETTE = ['#000012','#071029','#0ea5a4','#7dd3fc','#e0f2fe'];

const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d', { alpha: false });

function setPreviewSize(){
  const maxH = Math.min(window.innerHeight - 160, 720);
  const cssH = maxH;
  const cssW = Math.round(cssH * W / H);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
}
window.addEventListener('resize', setPreviewSize);
setPreviewSize();

// High-quality frame drawing tuned for visual impact and perfect loop
function drawGalaxyFrame(ctx2, tNorm, width = W, height = H) {
  const phase = tNorm * CYCLES;
  // background
  ctx2.fillStyle = PALETTE[0];
  ctx2.fillRect(0,0,width,height);

  ctx2.save();
  ctx2.translate(width/2, height/2);
  const rot = Math.sin(tNorm * Math.PI * 2 * 0.5) * 0.01;
  ctx2.rotate(rot);

  // layered starfield with parallax for depth
  const starLayers = 3;
  const seedOffset = 12345;
  for (let L=0; L<starLayers; L++){
    const count = [240, 140, 80][L];
    const alpha = 0.05 + 0.06 * L;
    ctx2.fillStyle = `rgba(255,255,255,${alpha})`;
    for (let i=0;i<count;i++){
      const a = (i * 16807 + seedOffset * (L+1)) % 2147483647;
      const rx = ((a / 2147483647) - 0.5) * width * 2;
      const ry = (((a * 48271) % 2147483647) / 2147483647 - 0.5) * height * 2;
      const zoomShift = Math.pow(2, phase % 1) * (0.08 * (L+1));
      const x = rx / (zoomShift) * (0.6 + 0.4 * L) * (1 + 0.03*Math.sin(tNorm*6 + i));
      const y = ry / (zoomShift) * (0.6 + 0.4 * L) * (1 + 0.03*Math.cos(tNorm*5 + i));
      const s = (L===0?1.6: L===1?1.1:0.7) * (1 + 0.5*Math.abs(Math.sin((i%7)+tNorm*6)));
      ctx2.fillRect(x, y, s, s);
    }
  }

  // nebula rings
  for (let i=0;i<RINGS;i++){
    const layerPhase = (phase + i / RINGS) % 1;
    const scale = Math.pow(2, layerPhase);
    const radius = BASE_RADIUS * ((i+1)/RINGS) / scale;

    const grad = ctx2.createRadialGradient(0,0, radius*0.15, 0,0, radius*1.1);
    grad.addColorStop(0, 'rgba(255,255,255,0.02)');
    grad.addColorStop(0.28, PALETTE[2]);
    grad.addColorStop(0.7, PALETTE[3]);
    grad.addColorStop(1, 'rgba(2,6,23,0.75)');

    ctx2.strokeStyle = grad;
    ctx2.lineWidth = Math.max(1, 20 * Math.max(0.18, 1 - i / (RINGS*1.02)));
    ctx2.globalAlpha = 0.13 * (1 + 0.6*Math.abs(Math.sin(tNorm * Math.PI * 2 * (1 + i*0.008))));
    const sides = 6 + (i % 6);
    ctx2.beginPath();
    for (let s=0;s<sides;s++){
      const theta = (s / sides) * Math.PI * 2;
      const wobble = 1 + 0.2 * Math.sin(theta*3 + tNorm*Math.PI*2*(1 + i*0.018) + i);
      const x = Math.cos(theta) * radius * wobble;
      const y = Math.sin(theta) * radius * wobble;
      if (s===0) ctx2.moveTo(x,y); else ctx2.lineTo(x,y);
    }
    ctx2.closePath();
    ctx2.stroke();
  }

  // luminous galactic core
  const coreGrad = ctx2.createRadialGradient(0,0,0,0,0, BASE_RADIUS*0.42);
  coreGrad.addColorStop(0, 'rgba(255,255,240,0.95)');
  coreGrad.addColorStop(0.18, 'rgba(255,180,90,0.12)');
  coreGrad.addColorStop(0.5, 'rgba(125,211,252,0.06)');
  coreGrad.addColorStop(1, 'rgba(2,6,23,0)');
  ctx2.globalCompositeOperation = 'lighter';
  ctx2.fillStyle = coreGrad;
  ctx2.beginPath();
  ctx2.arc(0,0, BASE_RADIUS*0.34, 0, Math.PI*2);
  ctx2.fill();
  ctx2.globalCompositeOperation = 'source-over';
  ctx2.restore();
}

// preview animation
let previewStart = performance.now();
function previewLoop(now){
  const tNorm = ((now - previewStart) % DURATION) / DURATION;
  drawGalaxyFrame(ctx, tNorm, W, H);
  requestAnimationFrame(previewLoop);
}
requestAnimationFrame(previewLoop);
</script>
</body>
</html>

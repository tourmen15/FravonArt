<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flowing River Stream — HD Download</title>
  <style>
    /* ---- Page layout & UI (clean, centered, responsive) ---- */
    :root{
      --deep:#1B3C59; --teal:#2C5F77; --sky:#A3D9FF; --silver:#E5E5E5; --sun:#FFD99F; --green:#739572;
      --bg: linear-gradient(180deg,#071824 0%, #0b2a3b 60%);
      --ui-radius:40px;
    }
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;color:#eaf6ff;background:var(--bg);}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:34px;box-sizing:border-box}
    .card{max-width:1200px;width:100%;background:rgba(255,255,255,0.02);backdrop-filter: blur(6px);border-radius:16px;padding:28px;box-shadow:0 6px 30px rgba(2,10,20,0.6);border:1px solid rgba(255,255,255,0.03)}
    .preview{display:flex;flex-direction:column;align-items:center;gap:18px}
    /* Canvas container keeps 1080p area but scales visually for responsive layout */
    .canvas-shell{width:100%;max-width:1080px;border-radius:12px;overflow:hidden;background:linear-gradient(180deg, rgba(20,40,60,0.4), rgba(14,30,40,0.6));display:flex;align-items:center;justify-content:center;padding:6px}
    canvas{display:block;width:100%;height:auto;image-rendering:optimizeQuality}
    /* Download button */
    .download-row{display:flex;gap:12px;align-items:center;margin-top:6px}
    .cta{background:var(--deep);color:#fff;padding:16px 28px;border-radius:999px;border:none;font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 6px 30px rgba(27,60,89,0.45);transition:transform .18s ease,box-shadow .18s ease,opacity .3s ease;}
    .cta:hover{transform:translateY(-3px);box-shadow:0 12px 44px rgba(27,60,89,0.5);}
    .cta:active{transform:translateY(0)}
    .cta.fade-in{animation:fadeIn .9s ease both .2s}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .subtle{color:rgba(220,240,255,0.7);font-size:13px}
    .status{font-size:13px;color:#cfeefe;background:rgba(255,255,255,0.02);padding:10px 12px;border-radius:10px}
    /* Responsive */
    @media(max-width:720px){.card{padding:16px}.cta{width:100%}}
    /* Tiny progress bar */
    .progress{height:8px;background:rgba(255,255,255,0.05);border-radius:8px;overflow:hidden;width:320px}
    .pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sun),var(--silver))}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="preview">
        <h1 style="margin:0;color:var(--sky);font-weight:600">Flowing River Stream — 8s Loop (Live Preview)</h1>
        <p class="subtle">Natural flowing river stream • 8 seconds • 60 FPS • Seamless loop</p>

        <div class="canvas-shell">
          <!-- Visible canvas is scaled to fit but the rendering uses an internal 1920x1080 render target for quality -->
          <canvas id="view" width="1920" height="1080" aria-label="Flowing River Stream preview"></canvas>
        </div>

        <div class="download-row">
          <button id="downloadBtn" class="cta fade-in">Free HD Download</button>
          <div style="display:flex;flex-direction:column;gap:8px">
            <div class="status" id="status">Ready to preview. Click download to render and save files.</div>
            <div style="display:flex;gap:8px;align-items:center">
              <div class="progress" title="progress"><div class="pbar" id="pbar"></div></div>
              <div class="subtle" id="progressText">Idle</div>
            </div>
          </div>
        </div>

        <p class="subtle" style="margin-top:10px">Files will be generated client-side. Browser may produce <strong>MP4</strong> when supported, otherwise <strong>WebM</strong> fallback will be used.</p>
      </div>
    </div>
  </div>

<script>
/*
  Flowing River Stream — single-file production-ready HTML5 animation
  - 8s perfectly looped animation using procedural waves + particles
  - Renders at internal 1920x1080 (1080p) for preview, and encodes to multiple aspect ratios
  - Client-side recording via MediaRecorder. Attempts MP4 first, falls back to WebM where necessary
  - No external libraries or assets
  - Inline comments explain sections for easy editing
*/

// ---------- Configuration / Constants ----------
const LOOP_DURATION = 8_000; // 8 seconds loop in ms
const FPS = 60; // target framerate for rendering/recording
const PREVIEW_WIDTH = 1920, PREVIEW_HEIGHT = 1080; // internal render size for preview
// aspect sizes to produce: landscape, portrait, square, instagram tall
const EXPORT_SIZES = [
  {name:'1920x1080', w:1920, h:1080},
  {name:'1080x1920', w:1080, h:1920},
  {name:'1080x1080', w:1080, h:1080},
  {name:'1080x1350', w:1080, h:1350}
];

// Color palette (user-specified)
const palette = {
  deep:'#1B3C59', teal:'#2C5F77', sky:'#A3D9FF', silver:'#E5E5E5', sun:'#FFD99F', leaf:'#739572'
};

// Grab DOM elements
const view = document.getElementById('view');
const ctx = view.getContext('2d', {alpha:true});
const downloadBtn = document.getElementById('downloadBtn');
const status = document.getElementById('status');
const pbar = document.getElementById('pbar');
const progressText = document.getElementById('progressText');

// Make the canvas visually responsive while keeping resolution high
function resizeVisualCanvas(){
  // scale the CSS size to fit container while keeping internal resolution
  const shell = view.parentElement;
  const maxW = Math.min(shell.clientWidth - 12, 1080);
  view.style.width = maxW + 'px';
  view.style.height = (maxW * PREVIEW_HEIGHT / PREVIEW_WIDTH) + 'px';
}
window.addEventListener('resize', resizeVisualCanvas);
resizeVisualCanvas();

// ---------- Procedural utilities (fast, lightweight) ----------
// Small, fast value-noise-ish function built from sin/cos blends to give organic motion without heavy perlin code
function fastNoise(x){
  return Math.sin(x*0.75) * 0.5 + Math.sin(x*1.9)*0.25 + Math.sin(x*3.7)*0.125;
}

// A tiny seeded pseudo-random generator for consistent particle positions
function mulberry32(a){
  return function(){
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

// ---------- Scene objects: particles + flow layers ----------
// We'll create layered flow bands (curvy ribbons) using sin/cos waves and alpha blending to simulate water depth
const flowLayers = [];
const NUM_LAYERS = 5; // few layers for depth
for(let i=0;i<NUM_LAYERS;i++){
  flowLayers.push({
    speed: 0.02 + i*0.01, // different speeds for parallax
    amplitude: 10 + i*8, // wave amplitude
    offset: i*1200 + 300, // phase offset
    hueMix: i/(NUM_LAYERS-1)
  });
}

// particles that float along river path
const particles = [];
const PRNG = mulberry32(123456);
for(let i=0;i<160;i++){
  // distribute across width and height range
  particles.push({
    x: PRNG() * PREVIEW_WIDTH,
    y: PRNG() * PREVIEW_HEIGHT,
    size: 0.8 + PRNG()*2.8,
    life: PRNG()*LOOP_DURATION,
    speedOffset: PRNG()*0.6
  });
}

// small ripples data (ephemeral), we'll create some static subtle eddies for loop
const ripples = [];
for(let i=0;i<18;i++){
  ripples.push({
    x: PRNG()*PREVIEW_WIDTH,
    y: PREVIEW_HEIGHT*0.45 + PRNG()*PREVIEW_HEIGHT*0.4,
    t: PRNG()*1000,
    base:2+PRNG()*6
  });
}

// ---------- Rendering helpers ----------
function drawGradientBackground(ctx,w,h){
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0, '#072635');
  g.addColorStop(1, '#052330');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);
}

function lerp(a,b,t){return a + (b-a)*t}

// make water color by blending palette
function waterColor(t){
  // t between 0..1
  function hexToRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function rgbToHex(r,g,b){return '#'+[r,g,b].map(x=>('0'+Math.round(x).toString(16)).slice(-2)).join('');}
  const c1 = hexToRgb(palette.deep), c2 = hexToRgb(palette.teal), c3 = hexToRgb(palette.sky);
  const mix12 = c1.map((v,i)=>lerp(v,c2[i],t));
  const mix = mix12.map((v,i)=>lerp(v,c3[i], (Math.sin(t*Math.PI*2)+1)/2 * 0.25 ));
  return rgbToHex(mix[0],mix[1],mix[2]);
}

// ---------- Main render function ----------
let start = performance.now();
function renderFrame(now, outCtx, W, H){
  const t = (now - start) % LOOP_DURATION;
  const loopT = t / LOOP_DURATION; // 0..1

  // background subtle gradient + sky reflection band
  drawGradientBackground(outCtx,W,H);

  // draw distant soft reflection (top band)
  const skyG = outCtx.createLinearGradient(0,H*0.05,0,H*0.35);
  skyG.addColorStop(0, 'rgba(163,217,255,0.18)');
  skyG.addColorStop(1, 'rgba(163,217,255,0)');
  outCtx.fillStyle = skyG;
  outCtx.fillRect(0,0,W,H*0.35);

  // river base
  const riverY = H*0.35;
  const riverH = H*0.6;
  const baseG = outCtx.createLinearGradient(0,riverY,0,riverY+riverH);
  baseG.addColorStop(0, palette.teal);
  baseG.addColorStop(0.6, palette.deep);
  baseG.addColorStop(1, palette.deep);
  outCtx.fillStyle = baseG;
  outCtx.fillRect(0,riverY,W,riverH);

  // flow layers (ribbons) for fake displacement and shimmer
  outCtx.globalCompositeOperation = 'lighter';
  for(let i=0;i<flowLayers.length;i++){
    const L = flowLayers[i];
    outCtx.save();
    outCtx.globalAlpha = 0.25 - i*0.03;
    const hueMix = L.hueMix;
    outCtx.fillStyle = waterColor(hueMix*0.6 + 0.1);

    // create a path that curves using sin waves
    outCtx.beginPath();
    for(let x=0;x<=W;x+=16){
      const nx = x/W*6 + (now*0.0005)*L.speed + L.offset*0.0005;
      const y = riverY + riverH*0.45 + Math.sin(nx*2.1 + i)*L.amplitude*fastNoise(nx*1.2) + Math.cos(nx*1.7 - i*0.5)*L.amplitude*0.4;
      if(x===0) outCtx.moveTo(x,y);
      else outCtx.lineTo(x,y);
    }
    // close shape down to bottom and paint
    outCtx.lineTo(W,riverY+riverH);
    outCtx.lineTo(0,riverY+riverH);
    outCtx.closePath();
    outCtx.fill();
    outCtx.restore();
  }
  outCtx.globalCompositeOperation = 'source-over';

  // shimmering highlights: animated thin strokes
  outCtx.save();
  outCtx.globalAlpha = 0.85;
  for(let i=0;i<6;i++){
    outCtx.beginPath();
    const off = now*0.0006*(1+i*0.6);
    for(let x=0;x<=W;x+=10){
      const nx = x/W*4 + off;
      const y = riverY + riverH*0.45 + Math.sin(nx*3.0 + i*0.7)*18*Math.cos(loopT*Math.PI*2 + i);
      if(x===0) outCtx.moveTo(x,y);
      else outCtx.lineTo(x,y);
    }
    outCtx.strokeStyle = 'rgba(229,229,229,'+ (0.12/(i+1))+')';
    outCtx.lineWidth = 1.2 + i*0.3;
    outCtx.stroke();
  }
  outCtx.restore();

  // ripples / eddies
  outCtx.save();
  outCtx.globalAlpha = 0.9;
  for(let r of ripples){
    const phase = ((now*0.001)+r.t/1000)%1;
    const radius = r.base + phase*40;
    outCtx.beginPath();
    outCtx.arc(r.x, r.y + Math.sin((now + r.x)*0.002)*6, radius, 0, Math.PI*2);
    outCtx.strokeStyle = 'rgba(255,255,255,'+ (0.02 * (1-phase)) +')';
    outCtx.lineWidth = 1.2*(1-phase);
    outCtx.stroke();
  }
  outCtx.restore();

  // floating particles
  outCtx.save();
  for(let p of particles){
    // update simulated along-stream movement based on noise
    const nx = (p.x / W) * 4 + (now*0.0003*(0.4+p.speedOffset));
    const drift = fastNoise(nx*2.3 + p.speedOffset*0.4);
    const yBase = riverY + riverH*0.45 + (drift * 60);
    const sway = Math.sin((now*0.001 + p.speedOffset)*2.3) * 18;
    const py = ( ( (p.y + sway + drift*30) + (loopT*H*0.03) ) % (riverY+riverH) );

    // shimmer circle
    outCtx.beginPath();
    outCtx.fillStyle = 'rgba(255,255,255,'+ (0.04 + (p.size/6)) +')';
    outCtx.ellipse(p.x + Math.sin(now*0.0005 + p.size)*6, py, p.size*2.2, p.size*1.0, 0, 0, Math.PI*2);
    outCtx.fill();

    // soft highlight
    outCtx.beginPath();
    outCtx.fillStyle = 'rgba(255,217,159,'+ (0.02 + (p.size/12)) +')';
    outCtx.ellipse(p.x + Math.cos(now*0.0004 + p.size)*3, py-2, p.size*1.2, p.size*0.6, 0, 0, Math.PI*2);
    outCtx.fill();
  }
  outCtx.restore();

  // subtle top glare for sunlight
  outCtx.save();
  const glare = outCtx.createRadialGradient(W*0.12, H*0.12, 10, W*0.12, H*0.12, H*0.8);
  glare.addColorStop(0, 'rgba(255,217,159,0.09)');
  glare.addColorStop(1, 'rgba(255,217,159,0)');
  outCtx.fillStyle = glare;
  outCtx.fillRect(0,0,W,H);
  outCtx.restore();

  // vignette
  outCtx.save();
  outCtx.globalCompositeOperation = 'multiply';
  const v = outCtx.createRadialGradient(W/2,H/2, W*0.1, W/2,H/2, Math.max(W,H));
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(0,0,0,0.22)');
  outCtx.fillStyle = v;
  outCtx.fillRect(0,0,W,H);
  outCtx.restore();
}

// ---------- Preview animation loop (drives visible canvas) ----------
let rafId;
function previewLoop(now){
  renderFrame(now, ctx, PREVIEW_WIDTH, PREVIEW_HEIGHT);
  rafId = requestAnimationFrame(previewLoop);
}
requestAnimationFrame(previewLoop);

// ---------- Export / Recording utility ----------
// Create an offscreen canvas at requested resolution and capture frames by playing the same render function
function createExportCanvas(w,h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// Attempt to pick a suitable mime type for MediaRecorder preferring mp4
function chooseMime(){
  const prefers = [
    'video/mp4;codecs="avc1.42E01E"',
    'video/mp4',
    'video/webm;codecs=vp09',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  for(let m of prefers){
    if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

async function recordCanvasToBlob(canvas, durationMs){
  return new Promise((resolve, reject)=>{
    const stream = canvas.captureStream(FPS);
    const mime = chooseMime();
    let options = mime?{mimeType:mime}:{mimeType:''};
    try{
      var recorder = new MediaRecorder(stream, options);
    }catch(e){
      try{ recorder = new MediaRecorder(stream); }catch(er){ reject(er); return; }
    }
    const chunks = [];
    recorder.ondataavailable = ev=>{ if(ev.data && ev.data.size) chunks.push(ev.data); };
    recorder.onstop = ()=>{ resolve(new Blob(chunks, {type: chunks[0]?.type || 'video/webm'})); };
    recorder.onerror = err=>reject(err);
    recorder.start(1000/10); // small timeslice

    // render frames into the canvas at fixed step for the duration
    const startT = performance.now();
    function step(now){
      const elapsed = now - startT;
      renderFrame(start + (elapsed % LOOP_DURATION), canvas.getContext('2d'), canvas.width, canvas.height);
      if(elapsed < durationMs){
        requestAnimationFrame(step);
      }else{
        recorder.stop();
      }
    }
    requestAnimationFrame(step);
  });
}

// download helper
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

// UI progress helpers
function setStatus(text){ status.textContent = text; }
function setProgress(p, text){ pbar.style.width = (p*100)+'%'; progressText.textContent = text || Math.round(p*100)+'%'; }

// ---------- Export flow: generates all sizes sequentially and triggers downloads ----------
downloadBtn.addEventListener('click', async ()=>{
  // disable while working
  downloadBtn.disabled = true; downloadBtn.style.opacity = 0.7;
  setStatus('Preparing export — generating files client-side');
  setProgress(0, '0%');

  try{
    for(let i=0;i<EXPORT_SIZES.length;i++){
      const s = EXPORT_SIZES[i];
      setStatus(`Rendering ${s.name} (${i+1}/${EXPORT_SIZES.length})`);
      setProgress(i/EXPORT_SIZES.length, `Rendering ${s.name}...`);

      // create canvas and scale content to target aspect by rendering at that resolution
      const exportCanvas = createExportCanvas(s.w, s.h);
      // Brief sleep to let UI update
      await new Promise(r=>setTimeout(r,40));

      const blob = await recordCanvasToBlob(exportCanvas, LOOP_DURATION); // 8s at 60fps

      // choose extension
      const mime = blob.type || '';
      let ext = '.webm';
      if(mime.includes('mp4')) ext = '.mp4';
      else if(mime.includes('webm')) ext = '.webm';

      triggerDownload(blob, `FlowingRiverStream_${s.name}${ext}`);
      setProgress((i+1)/EXPORT_SIZES.length, `Saved ${s.name}`);
    }

    setStatus('All files generated — check your downloads.');
    setProgress(1, 'Done');
  }catch(err){
    console.error(err);
    setStatus('Export failed: ' + (err && err.message ? err.message : String(err)));
  }finally{
    downloadBtn.disabled = false; downloadBtn.style.opacity = 1;
  }
});

// ---------- Performance notes: pause preview when tab not visible to save resources ----------
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ cancelAnimationFrame(rafId); }
  else{ requestAnimationFrame(previewLoop); }
});

// End of script
</script>
</body>
</html>

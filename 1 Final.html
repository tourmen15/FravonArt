<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Through an Endless Galaxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 1920px;
            max-height: 1080px;
            aspect-ratio: 16/9;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000;
            cursor: pointer;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        
        button {
            background: rgba(30, 30, 60, 0.7);
            color: white;
            border: 1px solid rgba(100, 150, 255, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        button:hover {
            background: rgba(50, 80, 180, 0.7);
            border-color: rgba(150, 200, 255, 0.8);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .recording-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(200, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        
        .recording-dot {
            width: 12px;
            height: 12px;
            background-color: #ff0000;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        
        .instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
        }
        
        .fullscreen-notice {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .fullscreen-notice.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="galaxyCanvas"></canvas>
        
        <div class="instructions">
            <p>Press <strong>R</strong> to Start/Stop Recording</p>
            <p>Press <strong>D</strong> to Download Recording</p>
        </div>
        
        <div class="recording-indicator" id="recordingIndicator">
            <div class="recording-dot"></div>
            <span>Recording...</span>
        </div>
        
        <div class="fullscreen-notice" id="fullscreenNotice">
            Click canvas to toggle fullscreen
        </div>
        
        <div class="controls">
            <button id="recordButton">Start Recording (10s)</button>
            <button id="downloadButton" disabled>Download Last Recording</button>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI elements
        const recordButton = document.getElementById('recordButton');
        const downloadButton = document.getElementById('downloadButton');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const fullscreenNotice = document.getElementById('fullscreenNotice');
        
        // Animation state
        let animationId = null;
        let zoomLevel = 1;
        let time = 0;
        let isRecording = false;
        let recordedChunks = [];
        let mediaRecorder = null;
        let recordingStartTime = 0;
        let recordingTimer = null;
        
        // Starfield layers
        const stars = {
            far: [],
            mid: [],
            near: []
        };
        
        // Nebula clouds
        const nebulas = [];
        
        // Resize canvas to maintain 16:9 aspect ratio
        function resizeCanvas() {
            const container = canvas.parentElement;
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            // Calculate dimensions to maintain 16:9 aspect ratio
            const targetRatio = 16/9;
            const containerRatio = containerWidth / containerHeight;
            
            if (containerRatio > targetRatio) {
                // Container is wider than 16:9
                canvas.width = containerHeight * targetRatio;
                canvas.height = containerHeight;
            } else {
                // Container is taller than 16:9
                canvas.width = containerWidth;
                canvas.height = containerWidth / targetRatio;
            }
            
            // Reinitialize if needed
            if (!stars.far.length) {
                initializeScene();
            }
        }
        
        // Initialize the cosmic scene
        function initializeScene() {
            // Clear existing data
            stars.far = [];
            stars.mid = [];
            stars.near = [];
            nebulas.length = 0;
            
            // Create stars for each layer
            createStars(stars.far, 800, 0.5, 1.5);    // Far stars: many, small, slow
            createStars(stars.mid, 400, 1, 2.5);      // Mid stars: medium count and size
            createStars(stars.near, 200, 1.5, 4);     // Near stars: fewer, larger, faster
            
            // Create nebula clouds
            createNebulas(8);
        }
        
        // Create stars for a specific layer
        function createStars(starArray, count, minSize, maxSize) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 300;
                
                starArray.push({
                    x: Math.cos(angle) * distance,
                    y: Math.sin(angle) * distance,
                    z: Math.random() * 1000 + 500, // Depth
                    size: minSize + Math.random() * (maxSize - minSize),
                    brightness: 0.3 + Math.random() * 0.7,
                    twinkleSpeed: 0.5 + Math.random() * 2,
                    twinkleOffset: Math.random() * Math.PI * 2,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.02
                });
            }
        }
        
        // Create procedural nebula clouds
        function createNebulas(count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 400;
                
                nebulas.push({
                    x: Math.cos(angle) * distance,
                    y: Math.sin(angle) * distance,
                    z: Math.random() * 800 + 200,
                    size: 80 + Math.random() * 120,
                    color: {
                        r: 100 + Math.floor(Math.random() * 155),
                        g: 100 + Math.floor(Math.random() * 100),
                        b: 150 + Math.floor(Math.random() * 105)
                    },
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.005,
                    opacity: 0.1 + Math.random() * 0.2,
                    pulseSpeed: 0.2 + Math.random() * 0.3,
                    pulseOffset: Math.random() * Math.PI * 2
                });
            }
        }
        
        // Render the galaxy core (central vortex)
        function renderGalaxyCore() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Base core size increases with zoom
            const baseSize = 50 + Math.sin(time * 0.5) * 10;
            const coreSize = baseSize * (1 + zoomLevel * 0.1);
            
            // Create radial gradient for the core
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, coreSize
            );
            
            // Core colors intensify with zoom
            const intensity = 0.7 + zoomLevel * 0.3;
            gradient.addColorStop(0, `rgba(255, 255, 200, ${intensity})`);
            gradient.addColorStop(0.3, `rgba(255, 200, 100, ${intensity * 0.8})`);
            gradient.addColorStop(0.6, `rgba(200, 100, 50, ${intensity * 0.5})`);
            gradient.addColorStop(1, `rgba(100, 50, 150, 0)`);
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreSize, 0, Math.PI * 2);
            ctx.fill();
            
            // Add spiral arms
            const armCount = 4;
            const armLength = coreSize * 3;
            const armWidth = coreSize * 0.8;
            
            for (let i = 0; i < armCount; i++) {
                const angle = (i / armCount) * Math.PI * 2 + time * 0.1;
                const armGradient = ctx.createLinearGradient(
                    centerX, centerY,
                    centerX + Math.cos(angle) * armLength,
                    centerY + Math.sin(angle) * armLength
                );
                
                armGradient.addColorStop(0, `rgba(150, 150, 255, ${0.3 * intensity})`);
                armGradient.addColorStop(1, `rgba(50, 50, 150, 0)`);
                
                ctx.strokeStyle = armGradient;
                ctx.lineWidth = armWidth;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(
                    centerX + Math.cos(angle) * armLength,
                    centerY + Math.sin(angle) * armLength
                );
                ctx.stroke();
            }
        }
        
        // Render a starfield layer with parallax effect
        function renderStarLayer(starArray, parallaxFactor) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            for (const star of starArray) {
                // Apply parallax based on zoom and layer
                const parallaxZoom = zoomLevel * parallaxFactor;
                const scale = 1 / (star.z + parallaxZoom);
                
                // Calculate screen position
                const screenX = centerX + star.x * scale;
                const screenY = centerY + star.y * scale;
                
                // Calculate twinkling effect
                const twinkle = 0.7 + 0.3 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
                
                // Calculate size with zoom
                const size = star.size * scale * (1 + zoomLevel * 0.1);
                
                // Skip if off-screen or too small
                if (size < 0.1 || screenX < -size || screenX > canvas.width + size || 
                    screenY < -size || screenY > canvas.height + size) {
                    continue;
                }
                
                // Draw the star
                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(star.rotation + time * star.rotationSpeed);
                
                // Create star gradient
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, size);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${star.brightness * twinkle})`);
                gradient.addColorStop(0.7, `rgba(200, 220, 255, ${star.brightness * twinkle * 0.7})`);
                gradient.addColorStop(1, `rgba(100, 150, 255, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, size, 0, Math.PI * 2);
                ctx.fill();
                
                // Add subtle glow
                ctx.shadowColor = `rgba(150, 180, 255, ${star.brightness * 0.5})`;
                ctx.shadowBlur = size * 2;
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // Render nebula clouds
        function renderNebulas() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            for (const nebula of nebulas) {
                // Apply parallax based on zoom
                const scale = 1 / (nebula.z + zoomLevel * 0.5);
                
                // Calculate screen position
                const screenX = centerX + nebula.x * scale;
                const screenY = centerY + nebula.y * scale;
                
                // Calculate size with zoom and pulsing
                const pulse = 0.8 + 0.2 * Math.sin(time * nebula.pulseSpeed + nebula.pulseOffset);
                const size = nebula.size * scale * pulse * (1 + zoomLevel * 0.05);
                
                // Skip if off-screen or too small
                if (size < 5 || screenX < -size || screenX > canvas.width + size || 
                    screenY < -size || screenY > canvas.height + size) {
                    continue;
                }
                
                // Draw the nebula
                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(nebula.rotation + time * nebula.rotationSpeed);
                
                // Create nebula gradient
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, size);
                gradient.addColorStop(0, `rgba(${nebula.color.r}, ${nebula.color.g}, ${nebula.color.b}, ${nebula.opacity})`);
                gradient.addColorStop(0.7, `rgba(${nebula.color.r * 0.7}, ${nebula.color.g * 0.7}, ${nebula.color.b}, ${nebula.opacity * 0.5})`);
                gradient.addColorStop(1, `rgba(${nebula.color.r * 0.3}, ${nebula.color.g * 0.3}, ${nebula.color.b * 0.7}, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // Main animation loop
        function animate() {
            // Clear canvas with a dark space color
            ctx.fillStyle = '#0a0a20';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update time and zoom
            time += 0.016; // ~60fps
            zoomLevel = Math.pow(1.05, time * 10); // Exponential zoom for infinite feel
            
            // Reset zoom occasionally to prevent overflow while maintaining illusion
            if (zoomLevel > 1000) {
                zoomLevel = 1;
                time = 0;
            }
            
            // Render all elements with depth ordering
            renderNebulas();
            renderStarLayer(stars.far, 0.3);   // Far stars move slowest
            renderStarLayer(stars.mid, 0.6);   // Mid stars
            renderStarLayer(stars.near, 1);    // Near stars move fastest
            renderGalaxyCore();
            
            // Continue animation
            animationId = requestAnimationFrame(animate);
        }
        
        // Start recording
        function startRecording() {
            if (isRecording) return;
            
            recordedChunks = [];
            isRecording = true;
            recordingStartTime = Date.now();
            
            // Update UI
            recordButton.textContent = "Stop Recording";
            recordingIndicator.style.display = "flex";
            downloadButton.disabled = true;
            
            // Set up media recorder
            const stream = canvas.captureStream(60); // 60 FPS
            const options = { mimeType: 'video/webm; codecs=vp9' };
            
            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                // Fallback to VP8 if VP9 not supported
                console.log("VP9 not supported, falling back to VP8");
                const fallbackOptions = { mimeType: 'video/webm; codecs=vp8' };
                mediaRecorder = new MediaRecorder(stream, fallbackOptions);
            }
            
            mediaRecorder.ondataavailable = handleDataAvailable;
            mediaRecorder.onstop = handleRecordingStop;
            
            // Start recording
            mediaRecorder.start(100); // Collect data in 100ms chunks
            
            // Auto-stop after 10 seconds
            recordingTimer = setTimeout(stopRecording, 10000);
        }
        
        // Stop recording
        function stopRecording() {
            if (!isRecording || !mediaRecorder) return;
            
            isRecording = false;
            mediaRecorder.stop();
            
            // Update UI
            recordButton.textContent = "Start Recording (10s)";
            recordingIndicator.style.display = "none";
            
            // Clear auto-stop timer
            if (recordingTimer) {
                clearTimeout(recordingTimer);
                recordingTimer = null;
            }
        }
        
        // Handle recorded data
        function handleDataAvailable(event) {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        }
        
        // Handle recording stop
        function handleRecordingStop() {
            downloadButton.disabled = false;
        }
        
        // Download the recording
        function downloadRecording() {
            if (recordedChunks.length === 0) {
                alert("No recording available to download.");
                return;
            }
            
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `galaxy-zoom-${new Date().toISOString().slice(0, 19)}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                canvas.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        // Show fullscreen notice briefly
        function showFullscreenNotice() {
            fullscreenNotice.classList.add('show');
            setTimeout(() => {
                fullscreenNotice.classList.remove('show');
            }, 2000);
        }
        
        // Event listeners
        recordButton.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });
        
        downloadButton.addEventListener('click', downloadRecording);
        
        canvas.addEventListener('click', () => {
            toggleFullscreen();
            showFullscreenNotice();
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                if (isRecording) {
                    stopRecording();
                } else {
                    startRecording();
                }
            } else if (e.key === 'd' || e.key === 'D') {
                downloadRecording();
            }
        });
        
        // Handle window resize
        window.addEventListener('resize', resizeCanvas);
        
        // Initialize and start animation
        resizeCanvas();
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Through an Endless Galaxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }
        
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(100, 150, 255, 0.8);
            letter-spacing: 3px;
            background: linear-gradient(to right, #8a2be2, #1e90ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 4s infinite alternate;
        }
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }
        
        button {
            background: rgba(30, 30, 60, 0.7);
            color: white;
            border: 1px solid #4a4aff;
            border-radius: 50px;
            padding: 12px 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }
        
        button:hover {
            background: rgba(60, 60, 120, 0.9);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(100, 150, 255, 0.7);
        }
        
        .info {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            color: #aaccff;
            text-shadow: 0 0 5px rgba(100, 150, 255, 0.5);
        }
        
        @keyframes pulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 100;
            transition: opacity 1s ease;
        }
        
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 70px;
            height: 70px;
            border: 5px solid rgba(100, 150, 255, 0.3);
            border-radius: 50%;
            border-top-color: #4a4aff;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>
    
    <div class="container">
        <div class="ui-overlay">
            <h1>Journey Through an Endless Galaxy</h1>
        </div>
        
        <div class="info">
            Infinite Zoom Through a Cosmic Wonder
        </div>
        
        <canvas id="galaxyCanvas"></canvas>
        
        <div class="controls">
            <button id="downloadBtn">Download MP4</button>
            <button id="pauseBtn">Pause/Resume</button>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas to 1920x1080 resolution
        canvas.width = 1920;
        canvas.height = 1080;
        
        // Scale canvas to fit screen while maintaining aspect ratio
        function resizeCanvas() {
            const container = canvas.parentElement;
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            const scale = Math.min(containerWidth / 1920, containerHeight / 1080);
            
            canvas.style.width = (1920 * scale) + 'px';
            canvas.style.height = (1080 * scale) + 'px';
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Animation variables
        let zoomLevel = 1;
        let stars = [];
        let nebulae = [];
        let planets = [];
        let paused = false;
        let frameCount = 0;
        let recording = false;
        let mediaRecorder;
        let recordedChunks = [];
        
        // Initialize stars
        function initStars(count) {
            stars = [];
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width - canvas.width / 2,
                    y: Math.random() * canvas.height - canvas.height / 2,
                    z: Math.random() * 2000,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 2 + 0.5,
                    brightness: Math.random() * 0.8 + 0.2,
                    color: Math.random() > 0.9 ? 
                        `hsl(${Math.random() * 60 + 200}, 100%, ${Math.random() * 30 + 70}%)` : 
                        `hsl(0, 0%, ${Math.random() * 30 + 70}%)`
                });
            }
        }
        
        // Initialize nebulae
        function initNebulae(count) {
            nebulae = [];
            for (let i = 0; i < count; i++) {
                const hue = Math.random() * 60 + 200; // Blue to purple range
                nebulae.push({
                    x: Math.random() * canvas.width * 3 - canvas.width * 1.5,
                    y: Math.random() * canvas.height * 3 - canvas.height * 1.5,
                    z: Math.random() * 3000 + 500,
                    width: Math.random() * 800 + 400,
                    height: Math.random() * 800 + 400,
                    hue: hue,
                    saturation: Math.random() * 30 + 70,
                    brightness: Math.random() * 20 + 10,
                    density: Math.random() * 0.5 + 0.3
                });
            }
        }
        
        // Initialize planets
        function initPlanets(count) {
            planets = [];
            for (let i = 0; i < count; i++) {
                const size = Math.random() * 100 + 50;
                const hue = Math.random() * 360;
                planets.push({
                    x: Math.random() * canvas.width * 4 - canvas.width * 2,
                    y: Math.random() * canvas.height * 4 - canvas.height * 2,
                    z: Math.random() * 4000 + 1000,
                    size: size,
                    hue: hue,
                    rings: Math.random() > 0.7,
                    ringSize: size * (Math.random() * 0.5 + 1.2),
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.01
                });
            }
        }
        
        // Draw a star
        function drawStar(star) {
            const scale = 1000 / (star.z + 1000);
            const x = canvas.width / 2 + star.x * scale;
            const y = canvas.height / 2 + star.y * scale;
            const size = star.size * scale;
            
            if (x < -size || x > canvas.width + size || y < -size || y > canvas.height + size) {
                return;
            }
            
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = star.color;
            ctx.globalAlpha = star.brightness * scale;
            ctx.fill();
            
            // Add glow for brighter stars
            if (star.brightness > 0.7) {
                ctx.beginPath();
                ctx.arc(x, y, size * 3, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(x, y, size, x, y, size * 3);
                gradient.addColorStop(0, star.color);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.globalAlpha = star.brightness * 0.3 * scale;
                ctx.fill();
            }
        }
        
        // Draw a nebula
        function drawNebula(nebula) {
            const scale = 1000 / (nebula.z + 1000);
            const x = canvas.width / 2 + nebula.x * scale;
            const y = canvas.height / 2 + nebula.y * scale;
            const width = nebula.width * scale;
            const height = nebula.height * scale;
            
            if (x + width < 0 || x - width > canvas.width || 
                y + height < 0 || y - height > canvas.height) {
                return;
            }
            
            ctx.save();
            ctx.translate(x, y);
            
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, width / 2);
            gradient.addColorStop(0, `hsla(${nebula.hue}, ${nebula.saturation}%, ${nebula.brightness}%, ${nebula.density * scale})`);
            gradient.addColorStop(1, `hsla(${nebula.hue}, ${nebula.saturation}%, ${nebula.brightness}%, 0)`);
            
            ctx.fillStyle = gradient;
            ctx.globalAlpha = nebula.density * scale * 0.5;
            ctx.fillRect(-width / 2, -height / 2, width, height);
            
            ctx.restore();
        }
        
        // Draw a planet
        function drawPlanet(planet) {
            const scale = 1000 / (planet.z + 1000);
            const x = canvas.width / 2 + planet.x * scale;
            const y = canvas.height / 2 + planet.y * scale;
            const size = planet.size * scale;
            
            if (x + size < 0 || x - size > canvas.width || 
                y + size < 0 || y - size > canvas.height) {
                return;
            }
            
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(planet.rotation);
            
            // Draw planet
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            
            // Create planet gradient
            const gradient = ctx.createRadialGradient(
                -size/3, -size/3, 0, 
                0, 0, size
            );
            gradient.addColorStop(0, `hsl(${planet.hue}, 80%, 60%)`);
            gradient.addColorStop(0.7, `hsl(${planet.hue}, 80%, 40%)`);
            gradient.addColorStop(1, `hsl(${planet.hue}, 80%, 20%)`);
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw planet details (craters, etc.)
            ctx.fillStyle = `hsla(${planet.hue}, 60%, 30%, 0.3)`;
            for (let i = 0; i < 5; i++) {
                const craterSize = Math.random() * size * 0.2;
                const craterX = Math.random() * size * 1.5 - size * 0.75;
                const craterY = Math.random() * size * 1.5 - size * 0.75;
                if (Math.sqrt(craterX*craterX + craterY*craterY) < size - craterSize) {
                    ctx.beginPath();
                    ctx.arc(craterX, craterY, craterSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Draw rings if applicable
            if (planet.rings) {
                const ringSize = planet.ringSize * scale;
                ctx.beginPath();
                ctx.ellipse(0, 0, ringSize, ringSize * 0.2, 0, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${(planet.hue + 30) % 360}, 70%, 60%, 0.7)`;
                ctx.lineWidth = size * 0.3;
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        // Main animation loop
        function animate() {
            if (paused) {
                requestAnimationFrame(animate);
                return;
            }
            
            frameCount++;
            
            // Clear canvas with a dark space color
            ctx.fillStyle = 'rgba(5, 5, 15, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw nebulae
            nebulae.forEach(nebula => {
                nebula.z -= nebula.density * 5;
                if (nebula.z < 100) {
                    nebula.z = 3000;
                    nebula.x = Math.random() * canvas.width * 3 - canvas.width * 1.5;
                    nebula.y = Math.random() * canvas.height * 3 - canvas.height * 1.5;
                }
                drawNebula(nebula);
            });
            
            // Update and draw stars
            stars.forEach(star => {
                star.z -= star.speed;
                if (star.z < 1) {
                    star.z = 2000;
                    star.x = Math.random() * canvas.width - canvas.width / 2;
                    star.y = Math.random() * canvas.height - canvas.height / 2;
                }
                drawStar(star);
            });
            
            // Update and draw planets
            planets.forEach(planet => {
                planet.z -= 3;
                planet.rotation += planet.rotationSpeed;
                if (planet.z < 100) {
                    planet.z = 4000;
                    planet.x = Math.random() * canvas.width * 4 - canvas.width * 2;
                    planet.y = Math.random() * canvas.height * 4 - canvas.height * 2;
                }
                drawPlanet(planet);
            });
            
            // Add occasional shooting stars
            if (frameCount % 120 === 0) {
                createShootingStar();
            }
            
            // Update zoom level for infinite zoom effect
            zoomLevel *= 1.002;
            
            requestAnimationFrame(animate);
        }
        
        // Create a shooting star
        function createShootingStar() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height / 2;
            const length = Math.random() * 100 + 50;
            const speed = Math.random() * 10 + 5;
            const angle = Math.random() * Math.PI / 4 - Math.PI / 8;
            
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            const gradient = ctx.createLinearGradient(0, 0, length, 0);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.8)');
            gradient.addColorStop(1, 'transparent');
            
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(length, 0);
            ctx.stroke();
            
            // Add glow
            ctx.strokeStyle = 'rgba(150, 180, 255, 0.3)';
            ctx.lineWidth = 10;
            ctx.stroke();
            
            ctx.restore();
        }
        
        // Download functionality
        document.getElementById('downloadBtn').addEventListener('click', startRecording);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        
        function togglePause() {
            paused = !paused;
            document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
        }
        
        function startRecording() {
            if (recording) return;
            
            recordedChunks = [];
            recording = true;
            document.getElementById('downloadBtn').textContent = 'Recording...';
            document.getElementById('downloadBtn').disabled = true;
            
            // Set up media recorder
            const stream = canvas.captureStream(60);
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: 8000000
            });
            
            mediaRecorder.ondataavailable = handleDataAvailable;
            mediaRecorder.onstop = handleStop;
            
            // Record for 10 seconds
            mediaRecorder.start();
            setTimeout(() => {
                if (mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
            }, 10000);
        }
        
        function handleDataAvailable(event) {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        }
        
        function handleStop() {
            recording = false;
            document.getElementById('downloadBtn').textContent = 'Download MP4';
            document.getElementById('downloadBtn').disabled = false;
            
            // Convert to MP4 and download
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'Endless_Galaxy_Zoom.mp4';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }
        
        // Initialize and start animation
        function init() {
            initStars(1500);
            initNebulae(8);
            initPlanets(12);
            
            // Hide loading screen after a short delay
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1000);
            
            animate();
        }
        
        // Start everything
        init();
    </script>
</body>
</html>
